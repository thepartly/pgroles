          }
        ],
        "name": "v1alpha1",
        "schema": {
          "openAPIV3Schema": {
            "description": "Auto-generated derived type for PostgresPolicyCandidateSpec via `CustomResource`",
            "properties": {
              "spec": {
                "description": "A one-shot, immutable proposal of policy content.\n\nThe operator plans a candidate in its parent policy's execution context and\npublishes a `PostgresPolicyPlan` for review; the active policy keeps\nenforcing throughout. A candidate never executes SQL in any state, and its\nspec cannot be edited — revising a proposal means creating a successor that\nnames the earlier one in `spec.replaces`.\n\nSee `docs/src/pages/docs/operator-candidates.md` for the behaviour and\n`docs/design/adr-001-candidate-api.md` for the API mechanics.",
                "properties": {
                  "content": {
                    "description": "The proposed policy content.",
                    "properties": {
                      "default_owner": {
                        "description": "Default owner for ALTER DEFAULT PRIVILEGES (e.g. \"app_owner\").",
                        "maxLength": 63,
                        "minLength": 1,
                        "nullable": true,
                        "type": "string"
                      },
                      "default_privileges": {
                        "description": "One-off default privileges.",
                        "items": {
                          "description": "Default privilege configuration.\n\nThe scope rules are also expressed as CEL so the API server rejects a bad\nentry at apply time. `resolved_scope` enforces the same rules for the CLI,\nwhich has no admission step.",
                          "properties": {
                            "grant": {
                              "items": {
                                "description": "A single default privilege grant entry.",
                                "properties": {
                                  "ensure": {
                                    "description": "Whether the listed privileges must exist or must not exist.\n\n`absent` asserts one ACL edge only. It plans a REVOKE when the privilege is\nfound live, and it says nothing about access the grantee may still have\nthrough role membership or ownership.",
                                    "enum": [
                                      "present",
                                      "absent"
                                    ],
                                    "type": "string"
                                  },
                                  "on_type": {
                                    "description": "PostgreSQL object types that can have privileges granted on them.",
                                    "enum": [
                                      "table",
                                      "view",
                                      "materialized_view",
                                      "sequence",
                                      "function",
                                      "schema",
                                      "database",
                                      "type"
                                    ],
                                    "type": "string"
                                  },
                                  "privileges": {
                                    "items": {
                                      "description": "PostgreSQL privilege types.",
                                      "enum": [
                                        "SELECT",
                                        "INSERT",
                                        "UPDATE",
                                        "DELETE",
                                        "TRUNCATE",
                                        "REFERENCES",
                                        "TRIGGER",
                                        "EXECUTE",
                                        "USAGE",
                                        "CREATE",
                                        "CONNECT",
                                        "TEMPORARY"
                                      ],
                                      "type": "string"
                                    },
                                    "maxItems": 16,
                                    "minItems": 1,
                                    "type": "array"
                                  },
                                  "role": {
                                    "description": "The role receiving the default privilege. Only used in top-level default_privileges\n(in profiles, the role is determined by expansion). The exact-uppercase\nvalue `PUBLIC` means the PostgreSQL PUBLIC pseudo-role.",
                                    "maxLength": 63,
                                    "minLength": 1,
                                    "nullable": true,
                                    "type": "string"
                                  }
                                },
                                "required": [
                                  "on_type",
                                  "privileges"
                                ],
                                "type": "object"
                              },
                              "maxItems": 64,
                              "type": "array"
                            },
                            "owner": {
                              "description": "The role that owns newly created objects. If omitted, uses manifest's default_owner.",
                              "maxLength": 63,
                              "minLength": 1,
                              "nullable": true,
                              "type": "string"
                            },
                            "schema": {
                              "description": "Schema shorthand, equivalent to `scope: {type: schema, schema: ...}`.\nExactly one of `schema` and `scope` must be set.",
                              "maxLength": 63,
                              "minLength": 1,
                              "nullable": true,
                              "type": "string"
                            },
                            "scope": {
                              "description": "Where the defaults apply: one schema, or owner-wide (global). Global\nscope renders `ALTER DEFAULT PRIVILEGES` without an `IN SCHEMA` clause.",
                              "nullable": true,
                              "properties": {
                                "schema": {
                                  "description": "Schema name. Required for `type: schema`, forbidden for `type: global`.",
                                  "maxLength": 63,
                                  "minLength": 1,
                                  "nullable": true,
                                  "type": "string"
                                },
                                "type": {
                                  "description": "The kind of default-privilege scope.",
                                  "enum": [
                                    "global",
                                    "schema"
                                  ],
                                  "type": "string"
                                }
                              },
                              "required": [
                                "type"
                              ],
                              "type": "object",
                              "x-kubernetes-validations": [
                                {
                                  "message": "`schema` is required when type is `schema` and forbidden when type is `global`",
                                  "rule": "has(self.schema) == (self.type == 'schema')"
                                }
                              ]
                            }
                          },
                          "required": [
                            "grant"
                          ],
                          "type": "object",
                          "x-kubernetes-validations": [
                            {
                              "message": "exactly one of `schema` and `scope` must be set",
                              "rule": "has(self.schema) != has(self.scope)"
                            }
                          ]
                        },
                        "maxItems": 512,
                        "type": "array"
                      },
                      "grants": {
                        "description": "One-off grants.",
                        "items": {
                          "description": "A concrete grant on a specific object or wildcard.",
                          "properties": {
                            "ensure": {
                              "description": "Whether the listed privileges must exist or must not exist.\n\n`absent` asserts one ACL edge only. It plans a REVOKE when the privilege is\nfound live, and it says nothing about access the grantee may still have\nthrough role membership or ownership.",
                              "enum": [
                                "present",
                                "absent"
                              ],
                              "type": "string"
                            },
                            "object": {
                              "description": "Target object for a grant.",
                              "properties": {
                                "name": {
                                  "description": "Object name, or \"*\" for all objects. Omit for schema-level grants;\nrequired for database grants, where it names the connected database.",
                                  "maxLength": 256,
                                  "minLength": 1,
                                  "nullable": true,
                                  "type": "string"
                                },
                                "schema": {
                                  "description": "Schema name. Required for most object types except database.",
                                  "maxLength": 63,
                                  "minLength": 1,
                                  "nullable": true,
                                  "type": "string"
                                },
                                "type": {
                                  "description": "PostgreSQL object types that can have privileges granted on them.",
                                  "enum": [
                                    "table",
                                    "view",
                                    "materialized_view",
                                    "sequence",
                                    "function",
                                    "schema",
                                    "database",
                                    "type"
                                  ],
                                  "type": "string"
                                }
                              },
                              "required": [
                                "type"
                              ],
                              "type": "object",
                              "x-kubernetes-validations": [
                                {
                                  "message": "database grant targets must set `name`",
                                  "rule": "self.type != 'database' || has(self.name)"
                                }
                              ]
                            },
                            "privileges": {
                              "items": {
                                "description": "PostgreSQL privilege types.",
                                "enum": [
                                  "SELECT",
                                  "INSERT",
                                  "UPDATE",
                                  "DELETE",
                                  "TRUNCATE",
                                  "REFERENCES",
                                  "TRIGGER",
                                  "EXECUTE",
                                  "USAGE",
                                  "CREATE",
                                  "CONNECT",
                                  "TEMPORARY"
                                ],
                                "type": "string"
                              },
                              "maxItems": 16,
                              "minItems": 1,
                              "type": "array"
                            },
                            "role": {
                              "description": "The grantee. The exact-uppercase value `PUBLIC` means the PostgreSQL\nPUBLIC pseudo-role; any other value is an ordinary role name.",
                              "maxLength": 63,
                              "minLength": 1,
                              "type": "string"
                            }
                          },
                          "required": [
                            "object",
                            "privileges",
                            "role"
                          ],
                          "type": "object"
                        },
                        "maxItems": 4096,
                        "type": "array"
                      },
                      "memberships": {
                        "description": "Membership edges.",
                        "items": {
                          "description": "A membership declaration — which members belong to a role.",
                          "properties": {
                            "members": {
                              "items": {
                                "description": "A single member of a role.\n\nBoth `inherit` and `admin` are optional. When omitted, they default to\n`inherit: true` and `admin: false` at resolution time (in `RoleGraph`\nconstruction). Keeping them optional in the CRD avoids Kubernetes\ninjecting default values into the stored resource, which causes\nperpetual diffs in GitOps tools like ArgoCD.",
                                "properties": {
                                  "admin": {
                                    "description": "Whether the member can administer the role. Defaults to `false`.",
                                    "nullable": true,
                                    "type": "boolean"
                                  },
                                  "inherit": {
                                    "description": "Whether the member inherits the role's privileges. Defaults to `true`.",
                                    "nullable": true,
                                    "type": "boolean"
                                  },
                                  "name": {
                                    "maxLength": 63,
                                    "minLength": 1,
                                    "type": "string"
                                  }
                                },
                                "required": [
                                  "name"
                                ],
                                "type": "object"
                              },
                              "maxItems": 512,
                              "type": "array"
                            },
                            "role": {
                              "maxLength": 63,
                              "minLength": 1,
                              "type": "string"
                            }
                          },
                          "required": [
                            "members",
                            "role"
                          ],
                          "type": "object"
                        },
                        "maxItems": 2048,
                        "type": "array"
                      },
                      "profiles": {
                        "additionalProperties": {
                          "description": "A reusable privilege profile (CRD-compatible version).\n\nThis mirrors `pgroles_core::manifest::Profile` but derives `JsonSchema`.",
                          "properties": {
                            "config": {
                              "additionalProperties": {
                                "description": "A role configuration parameter value.\n\nValues are always strings — quote numbers and booleans (e.g.\n`statement_timeout: \"30000\"`, `jit: \"off\"`). The Kubernetes CRD schema\ntypes config values as strings, and the CLI enforces the same rule so a\nmanifest means the same thing whether it is applied with `pgroles` or\n`kubectl`. PostgreSQL coerces the string to the parameter's type.",
                                "maxLength": 256,
                                "type": "string"
                              },
                              "description": "Role-level configuration parameter defaults for generated roles,\napplied via `ALTER ROLE ... SET parameter = value`. Values support the\n`{schema}` and `{profile}` placeholders, substituted per `schema x\nprofile` expansion (e.g. `search_path: \"{schema}\"`).",
                              "maxProperties": 32,
                              "type": "object"
                            },
                            "default_privileges": {
                              "items": {
                                "description": "Default privilege grant within a profile.",
                                "properties": {
                                  "ensure": {
                                    "description": "Whether the privilege must be present or absent. Matches the\ntop-level `default_privileges` entries, which carry the same field.",
                                    "enum": [
                                      "present",
                                      "absent"
                                    ],
                                    "type": "string"
                                  },
                                  "on_type": {
                                    "description": "PostgreSQL object types that can have privileges granted on them.",
                                    "enum": [
                                      "table",
                                      "view",
                                      "materialized_view",
                                      "sequence",
                                      "function",
                                      "schema",
                                      "database",
                                      "type"
                                    ],
                                    "type": "string"
                                  },
                                  "privileges": {
                                    "items": {
                                      "description": "PostgreSQL privilege types.",
                                      "enum": [
                                        "SELECT",
                                        "INSERT",
                                        "UPDATE",
                                        "DELETE",
                                        "TRUNCATE",
                                        "REFERENCES",
                                        "TRIGGER",
                                        "EXECUTE",
                                        "USAGE",
                                        "CREATE",
                                        "CONNECT",
                                        "TEMPORARY"
                                      ],
                                      "type": "string"
                                    },
                                    "maxItems": 16,
                                    "minItems": 1,
                                    "type": "array"
                                  },
                                  "role": {
                                    "maxLength": 63,
                                    "minLength": 1,
                                    "nullable": true,
                                    "type": "string"
                                  }
                                },
                                "required": [
                                  "on_type",
                                  "privileges"
                                ],
                                "type": "object"
                              },
                              "maxItems": 32,
                              "type": "array"
                            },
                            "grants": {
                              "items": {
                                "description": "Grant template within a profile.",
                                "properties": {
                                  "ensure": {
                                    "description": "Whether the privilege must be present or absent. Matches the top-level\n`grants` entries, which carry the same field. Profiles are additive\ntemplates, so validation rejects `absent`; the schema accepts it so the\nAPI server does not prune the value before that check can name it.",
                                    "enum": [
                                      "present",
                                      "absent"
                                    ],
                                    "type": "string"
                                  },
                                  "object": {
                                    "description": "Object target within a profile.",
                                    "properties": {
                                      "name": {
                                        "maxLength": 256,
                                        "minLength": 1,
                                        "nullable": true,
                                        "type": "string"
                                      },
                                      "type": {
                                        "description": "PostgreSQL object types that can have privileges granted on them.",
                                        "enum": [
                                          "table",
                                          "view",
                                          "materialized_view",
                                          "sequence",
                                          "function",
                                          "schema",
                                          "database",
                                          "type"
                                        ],
                                        "type": "string"
                                      }
                                    },
                                    "required": [
                                      "type"
                                    ],
                                    "type": "object"
                                  },
                                  "privileges": {
                                    "items": {
                                      "description": "PostgreSQL privilege types.",
                                      "enum": [
                                        "SELECT",
                                        "INSERT",
                                        "UPDATE",
                                        "DELETE",
                                        "TRUNCATE",
                                        "REFERENCES",
                                        "TRIGGER",
                                        "EXECUTE",
                                        "USAGE",
                                        "CREATE",
                                        "CONNECT",
                                        "TEMPORARY"
                                      ],
                                      "type": "string"
                                    },
                                    "maxItems": 16,
                                    "minItems": 1,
                                    "type": "array"
                                  }
                                },
                                "required": [
                                  "object",
                                  "privileges"
                                ],
                                "type": "object"
                              },
                              "maxItems": 64,
                              "type": "array"
                            },
                            "inherit": {
                              "nullable": true,
                              "type": "boolean"
                            },
                            "login": {
                              "nullable": true,
                              "type": "boolean"
                            }
                          },
                          "type": "object"
                        },
                        "description": "Reusable privilege profiles.\n\nA `BTreeMap` rather than the policy's `HashMap`: the content digest is\ncomputed over a canonical serialization, and deterministic iteration\norder is one less thing that has to be normalised later.",
                        "maxProperties": 128,
                        "type": "object"
                      },
                      "reconciliation_mode": {
                        "description": "Convergence strategy: how aggressively to converge the database.",
                        "enum": [
                          "authoritative",
                          "additive",
                          "adopt"
                        ],
                        "type": "string"
                      },
                      "retirements": {
                        "description": "Explicit role-retirement workflows for roles that should be removed.",
                        "items": {
                          "description": "Declarative workflow for retiring an existing role.",
                          "properties": {
                            "drop_owned": {
                              "description": "Whether to run `DROP OWNED BY` before dropping the role.",
                              "type": "boolean"
                            },
                            "reassign_owned_to": {
                              "description": "Optional successor role for `REASSIGN OWNED BY ... TO ...`.",
                              "maxLength": 63,
                              "minLength": 1,
                              "nullable": true,
                              "type": "string"
                            },
                            "role": {
                              "description": "The role to retire and ultimately drop.",
                              "maxLength": 63,
                              "minLength": 1,
                              "type": "string"
                            },
                            "terminate_sessions": {
                              "description": "Whether to terminate other active sessions for the role before drop.",
                              "type": "boolean"
                            }
                          },
                          "required": [
                            "role"
                          ],
                          "type": "object"
                        },
                        "maxItems": 512,
                        "type": "array"
                      },
                      "roles": {
                        "description": "One-off role definitions.",
                        "items": {
                          "description": "A concrete role definition (CRD-compatible version).",
                          "properties": {
                            "bypassrls": {
                              "nullable": true,
                              "type": "boolean"
                            },
                            "comment": {
                              "maxLength": 256,
                              "nullable": true,
                              "type": "string"
                            },
                            "config": {
                              "additionalProperties": {
                                "description": "A role configuration parameter value.\n\nValues are always strings — quote numbers and booleans (e.g.\n`statement_timeout: \"30000\"`, `jit: \"off\"`). The Kubernetes CRD schema\ntypes config values as strings, and the CLI enforces the same rule so a\nmanifest means the same thing whether it is applied with `pgroles` or\n`kubectl`. PostgreSQL coerces the string to the parameter's type.",
                                "maxLength": 256,
                                "type": "string"
                              },
                              "description": "Role-level configuration parameter defaults, applied via\n`ALTER ROLE ... SET parameter = value` (e.g. `role: combined`,\n`search_path: app`). Settings present on the role in the database but\nabsent here are RESET in authoritative mode.",
                              "maxProperties": 32,
                              "type": "object"
                            },
                            "connection_limit": {
                              "format": "int32",
                              "nullable": true,
                              "type": "integer"
                            },
                            "createdb": {
                              "nullable": true,
                              "type": "boolean"
                            },
                            "createrole": {
                              "nullable": true,
                              "type": "boolean"
                            },
                            "external": {
                              "description": "Treat this role as externally managed. The operator may reference it in\ngrants, ownership, and memberships, but will not create, alter, drop,\npassword-manage, or manage memberships granted from this role.",
                              "type": "boolean"
                            },
                            "inherit": {
                              "nullable": true,
                              "type": "boolean"
                            },
                            "login": {
                              "nullable": true,
                              "type": "boolean"
                            },
                            "name": {
                              "maxLength": 63,
                              "minLength": 1,
                              "type": "string"
                            },
                            "password": {
                              "description": "Password source for this role. Either a reference to an existing Secret\nor a request for the operator to generate one.",
                              "nullable": true,
                              "properties": {
                                "generate": {
                                  "description": "Generate a random password and store it in a new Kubernetes Secret.\nMutually exclusive with `secretRef`.",
                                  "nullable": true,
                                  "properties": {
                                    "length": {
                                      "description": "Password length. Defaults to 32. Minimum 16, maximum 128.",
                                      "format": "uint32",
                                      "minimum": 0.0,
                                      "nullable": true,
                                      "type": "integer"
                                    },
                                    "secretKey": {
                                      "description": "Key within the generated Secret. Defaults to `password`.",
                                      "maxLength": 253,
                                      "minLength": 1,
                                      "nullable": true,
                                      "type": "string"
                                    },
                                    "secretName": {
                                      "description": "Override the generated Secret name. Defaults to `{policy}-pgr-{role}`.",
                                      "maxLength": 253,
                                      "minLength": 1,
                                      "nullable": true,
                                      "type": "string"
                                    }
                                  },
                                  "type": "object"
                                },
                                "secretKey": {
                                  "description": "Key within the referenced Secret. Defaults to the role name.\nOnly used with `secretRef`.",
                                  "maxLength": 253,
                                  "minLength": 1,
                                  "nullable": true,
                                  "type": "string"
                                },
                                "secretRef": {
                                  "description": "Reference to an existing Kubernetes Secret containing the password.\nMutually exclusive with `generate`.",
                                  "nullable": true,
                                  "properties": {
                                    "name": {
                                      "description": "Name of the Secret.",
                                      "maxLength": 253,
                                      "minLength": 1,
                                      "type": "string"
                                    }
                                  },
                                  "required": [
                                    "name"
                                  ],
                                  "type": "object"
                                }
                              },
                              "type": "object"
                            },
                            "password_valid_until": {
                              "description": "Password expiration timestamp (ISO 8601, e.g. \"2025-12-31T00:00:00Z\").",
                              "maxLength": 64,
                              "nullable": true,
                              "type": "string"
                            },
                            "preserve_undeclared_grants": {
                              "description": "Preserve this role's undeclared in-scope object grants during\nconvergence. Revokes against the role are skipped unless the revoked\nprivileges are explicitly asserted absent (`ensure: absent`).",
                              "type": "boolean"
                            },
                            "replication": {
                              "nullable": true,
                              "type": "boolean"
                            },
                            "superuser": {
                              "nullable": true,
                              "type": "boolean"
                            }
                          },
                          "required": [
                            "name"
                          ],
                          "type": "object"
                        },
                        "maxItems": 1024,
                        "type": "array"
                      },
                      "schemas": {
                        "description": "Schema bindings that expand profiles into concrete roles/grants.",
                        "items": {
                          "description": "A schema binding — associates a schema with one or more profiles.\n\nField bounds come from [`crate::bounds`]; see that module for why they\nexist and where else they are enforced.",
                          "properties": {
                            "name": {
                              "maxLength": 63,
                              "minLength": 1,
                              "type": "string"
                            },
                            "owner": {
                              "description": "Override default_owner for this schema's default privileges.",
                              "maxLength": 63,
                              "minLength": 1,
                              "nullable": true,
                              "type": "string"
                            },
