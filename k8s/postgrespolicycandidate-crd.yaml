                              "items": {
                                "maxLength": 63,
                                "minLength": 1,
                                "type": "string"
                              },
                              "maxItems": 64,
                              "type": "array"
                            },
                            "role_pattern": {
                              "description": "Role naming pattern. Supports `{schema}` and `{profile}` placeholders.\nDefaults to `\"{schema}-{profile}\"`.",
                              "maxLength": 128,
                              "minLength": 1,
                              "type": "string"
                            }
                          },
                          "required": [
                            "name"
                          ],
                          "type": "object"
                        },
                        "maxItems": 1024,
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "policyRef": {
                    "description": "The `PostgresPolicy` this candidate proposes content for. Resolved in\nthe candidate's own namespace: an owner reference cannot cross\nnamespaces, so neither can this.",
                    "properties": {
                      "name": {
                        "maxLength": 253,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": [
                      "name"
                    ],
                    "type": "object"
                  },
                  "replaces": {
                    "description": "Name of an earlier candidate this one supersedes.\n\nSupersession is always explicit. The operator never infers it from\ncreator identity, because CI typically files every team's candidates\nunder one service account.",
                    "maxLength": 253,
                    "minLength": 1,
                    "nullable": true,
                    "type": "string"
                  },
                  "target": {
                    "description": "Preview the content against a different connection than the parent\npolicy's. Credentials, locking and the plan's bound target identity all\nfollow the override, which is why such a plan is a preview and never a\nmigration step.",
                    "nullable": true,
