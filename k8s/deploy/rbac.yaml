---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgroles-operator
  namespace: pgroles-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgroles-operator
rules:
  # Watch and manage PostgresPolicy CRDs
  - apiGroups: ["pgroles.io"]
    resources: ["postgrespolicies"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["pgroles.io"]
    resources: ["postgrespolicies/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["pgroles.io"]
    resources: ["postgrespolicies/finalizers"]
    verbs: ["update"]
  # PostgresDatabase (ADR-002 prototype): read databases, write their status,
  # and create the operator-owned composed policy for each.
  - apiGroups: ["pgroles.io"]
    resources: ["postgresdatabases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["pgroles.io"]
    resources: ["postgresdatabases/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["pgroles.io"]
    resources: ["postgrespolicies"]
    verbs: ["create"]
  # Logical verb consumed by the plan-decision admission policy to tell the
  # operator's own plan-status writes from a reviewer's decision, without
  # hard-coding a ServiceAccount identity. Grant it to controllers only:
  # holding it exempts the caller from the approve-verb check on decisions.
  - apiGroups: ["pgroles.io"]
    resources: ["postgrespolicies"]
    verbs: ["manage"]
  # Watch and manage PostgresPolicyPlan CRDs
  - apiGroups: ["pgroles.io"]
    resources: ["postgrespolicyplans"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["pgroles.io"]
    resources: ["postgrespolicyplans/status"]
    verbs: ["get", "patch", "update"]
  # Watch and manage PostgresPolicyCandidate CRDs. The operator reads
  # candidates and owns their status; it never writes their spec, which the
  # API server holds immutable anyway. `patch` is for adoption — stamping the
  # parent policy's ownerReference onto the candidate — and `delete` for
  # pruning terminal candidates beyond the retention bound.
  - apiGroups: ["pgroles.io"]
    resources: ["postgrespolicycandidates"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: ["pgroles.io"]
    resources: ["postgrespolicycandidates/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["pgroles.io"]
    resources: ["postgrespolicycandidates/finalizers"]
    verbs: ["update"]
  # Ephemeral access lifecycle. The operator is not an approver; a validating
  # admission policy protects Approved/Denied condition mutations.
  - apiGroups: ["pgroles.io"]
    resources: ["ephemeralaccesspolicies", "ephemeralaccessrequests"]
    verbs: ["get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["pgroles.io"]
    resources: ["ephemeralaccesspolicies/status", "ephemeralaccessrequests/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["pgroles.io"]
    resources: ["ephemeralaccesspolicies/finalizers", "ephemeralaccessrequests/finalizers"]
    verbs: ["update"]
  # Logical verb consumed by secure admission policy for controller-owned
  # lifecycle status and finalizer changes.
  - apiGroups: ["pgroles.io"]
    resources: ["ephemeralaccesspolicies"]
    verbs: ["manage"]
  # Read Secrets for database connection strings and password references;
  # create/update Secrets for operator-generated passwords.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Create ConfigMaps for plan SQL storage
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Emit events for kubectl describe / operational debugging
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgroles-operator
subjects:
  - kind: ServiceAccount
    name: pgroles-operator
    namespace: pgroles-system
roleRef:
  kind: ClusterRole
  name: pgroles-operator
  apiGroup: rbac.authorization.k8s.io
