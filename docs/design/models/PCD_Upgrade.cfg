\* Upgrade start state. Expected: all hold (at most one of a conflicting pair applies again).
SPECIFICATION Spec
CONSTANTS
    Policies = {p1, p2}
    Identities = {i1, i2, i3}
    Databases = {d1, d2}
    Contents = {c1, c2}
    ConflictSets = {{c1, c2}}
    None = None
    CrdUpgraded = TRUE
    Legacy = TRUE
    AllowContentEdit = FALSE
    AllowConnEdit = FALSE
    AllowRetarget = FALSE
    AllowOutage = TRUE
INVARIANTS
    TypeOK
    MutualExclusion
    NoMutualClobber
    LateApplyBound
    SameIdentityNeverApplies
    TrustedRecordAccurate
    NoPhantomConflict
