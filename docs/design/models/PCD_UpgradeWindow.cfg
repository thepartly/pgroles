\* Upgrade start state. Expected: NoClobber VIOLATED - the one-apply window.
SPECIFICATION Spec
CONSTANTS
    Policies = {p1, p2}
    Identities = {i1, i2}
    Databases = {d1, d2}
    Contents = {c1, c2}
    ConflictSets = {{c1, c2}}
    None = None
    CrdUpgraded = TRUE
    Legacy = TRUE
    AllowContentEdit = FALSE
    AllowConnEdit = FALSE
    AllowRetarget = FALSE
    AllowOutage = FALSE
INVARIANTS
    NoClobber
