{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "postgresdatabases.pgroles.io"
  },
  "spec": {
    "group": "pgroles.io",
    "names": {
      "categories": [
        "pgroles"
      ],
      "kind": "PostgresDatabase",
      "plural": "postgresdatabases",
      "shortNames": [
        "pgdb"
      ],
      "singular": "postgresdatabase"
    },
    "scope": "Namespaced",
    "versions": [
      {
        "additionalPrinterColumns": [
          {
            "jsonPath": ".status.conditions[?(@.type==\"Ready\")].status",
            "name": "Ready",
            "type": "string"
          },
          {
            "jsonPath": ".status.acceptedPolicies",
            "name": "Accepted",
            "type": "integer"
          },
          {
            "jsonPath": ".status.rejectedPolicies",
            "name": "Rejected",
            "type": "integer"
          },
          {
            "jsonPath": ".metadata.creationTimestamp",
            "name": "Age",
            "type": "date"
          }
        ],
        "name": "v1alpha1",
        "schema": {
          "openAPIV3Schema": {
            "description": "Auto-generated derived type for PostgresDatabaseSpec via `CustomResource`",
            "properties": {
              "spec": {
                "description": "Spec for a `PostgresDatabase` custom resource.",
                "properties": {
                  "approval": {
                    "description": "Approval mode for plans generated by this policy.\n\nSet this explicitly. When omitted it is currently inferred from `spec.mode`\n(`apply` implies `auto`, `observe` implies `manual`), which leaves a policy's\nexecution gate invisible on the object. That inference is deprecated: a\npolicy relying on it reports an `ApprovalUnset` status condition, and a\nfuture release will reject a policy that omits this field.",
                    "enum": [
                      "manual",
                      "auto"
                    ],
                    "nullable": true,
                    "type": "string"
                  },
                  "connection": {
                    "description": "How the operator reaches the database. Only the database owner holds\nthis credential.",
                    "properties": {
                      "params": {
                        "description": "Structured connection parameters. Each field is either a plain string\nor a reference to a Secret key. Mutually exclusive with `secretRef`.",
                        "nullable": true,
                        "properties": {
                          "auth": {
                            "description": "Provider-backed authentication for connections that use short-lived\ncredentials instead of a static PostgreSQL password.",
                            "nullable": true,
                            "properties": {
                              "impersonateServiceAccount": {
                                "description": "Target Google service account to impersonate before requesting the\nCloud SQL login token. Omit to use the pod's bound identity.",
                                "nullable": true,
                                "type": "string"
                              },
                              "scope": {
                                "description": "OAuth scope requested for the access token.",
                                "nullable": true,
                                "type": "string"
                              },
                              "type": {
                                "description": "Provider authentication mechanism.",
                                "enum": [
                                  "gcp_workload_identity",
                                  "azure_workload_identity"
                                ],
                                "type": "string"
                              }
                            },
                            "required": [
                              "type"
                            ],
                            "type": "object",
                            "x-kubernetes-validations": [
                              {
                                "message": "scope and impersonateServiceAccount are only supported with gcp_workload_identity",
                                "rule": "self.type == 'gcp_workload_identity' || (!has(self.scope) && !has(self.impersonateServiceAccount))"
                              }
                            ]
                          },
                          "dbname": {
                            "description": "Database name as a literal value.",
                            "nullable": true,
                            "type": "string"
                          },
                          "dbnameSecret": {
                            "description": "Database name from a Secret key.",
                            "nullable": true,
                            "properties": {
                              "key": {
                                "description": "Key within the Secret.",
                                "maxLength": 253,
                                "minLength": 1,
                                "type": "string"
                              },
                              "name": {
                                "description": "Name of the Secret.",
                                "maxLength": 253,
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": [
                              "key",
                              "name"
                            ],
                            "type": "object"
                          },
                          "host": {
                            "description": "PostgreSQL host as a literal value.",
                            "nullable": true,
                            "type": "string"
                          },
                          "hostSecret": {
                            "description": "PostgreSQL host from a Secret key.",
                            "nullable": true,
                            "properties": {
                              "key": {
                                "description": "Key within the Secret.",
                                "maxLength": 253,
                                "minLength": 1,
                                "type": "string"
                              },
                              "name": {
                                "description": "Name of the Secret.",
                                "maxLength": 253,
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": [
                              "key",
                              "name"
                            ],
                            "type": "object"
                          },
                          "password": {
                            "description": "Password as a literal value (not recommended for production).",
                            "nullable": true,
                            "type": "string"
                          },
                          "passwordSecret": {
                            "description": "Password from a Secret key (recommended).",
                            "nullable": true,
                            "properties": {
                              "key": {
                                "description": "Key within the Secret.",
                                "maxLength": 253,
                                "minLength": 1,
                                "type": "string"
                              },
                              "name": {
                                "description": "Name of the Secret.",
                                "maxLength": 253,
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": [
                              "key",
                              "name"
                            ],
                            "type": "object"
                          },
                          "port": {
                            "description": "Port as a literal value. Defaults to 5432 if neither port nor portSecret is set.",
                            "format": "uint16",
                            "maximum": 65535.0,
                            "minimum": 0.0,
                            "nullable": true,
                            "type": "integer"
                          },
                          "portSecret": {
                            "description": "Port from a Secret key.",
                            "nullable": true,
                            "properties": {
                              "key": {
                                "description": "Key within the Secret.",
                                "maxLength": 253,
                                "minLength": 1,
                                "type": "string"
                              },
                              "name": {
                                "description": "Name of the Secret.",
                                "maxLength": 253,
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": [
                              "key",
                              "name"
                            ],
                            "type": "object"
                          },
                          "setRole": {
                            "description": "Run `SET ROLE \"<value>\"` once on every pooled connection. Useful when\nthe operator authenticates as a low-privilege identity (e.g. a Cloud\nSQL IAM user) that has been granted membership in a privileged role\nlike `cloudsqlsuperuser` — PostgreSQL does not inherit role\n*attributes* (`CREATEROLE`, `CREATEDB`, …) through `GRANT … TO …`, so\n`SET ROLE` is required for the connection to act with the parent\nrole's attributes.\n\nMust be a simple PostgreSQL identifier matching\n`^[A-Za-z_][A-Za-z0-9_$-]*$`. The pattern intentionally excludes `@`\nand `.` — `setRole` is for switching to a privileged *group* role\n(e.g. `cloudsqlsuperuser`), not an IAM-style principal like\n`pgroles-operator@project.iam`, which has no extra attributes to\ninherit via `SET ROLE`.",
                            "nullable": true,
                            "pattern": "^[A-Za-z_][A-Za-z0-9_$-]*$",
                            "type": "string"
                          },
                          "sslMode": {
                            "description": "SSL mode as a literal value.",
                            "nullable": true,
                            "type": "string"
                          },
                          "sslModeSecret": {
                            "description": "SSL mode from a Secret key.",
                            "nullable": true,
                            "properties": {
                              "key": {
                                "description": "Key within the Secret.",
                                "maxLength": 253,
                                "minLength": 1,
                                "type": "string"
                              },
                              "name": {
                                "description": "Name of the Secret.",
                                "maxLength": 253,
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": [
                              "key",
                              "name"
                            ],
                            "type": "object"
                          },
                          "username": {
                            "description": "Username as a literal value.",
                            "nullable": true,
                            "type": "string"
                          },
                          "usernameSecret": {
                            "description": "Username from a Secret key.",
                            "nullable": true,
                            "properties": {
                              "key": {
                                "description": "Key within the Secret.",
                                "maxLength": 253,
                                "minLength": 1,
                                "type": "string"
                              },
                              "name": {
                                "description": "Name of the Secret.",
                                "maxLength": 253,
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": [
                              "key",
                              "name"
                            ],
                            "type": "object"
                          }
                        },
                        "type": "object"
                      },
                      "requirePhysicalIdentity": {
                        "description": "Refuse to plan or execute unless the target's *physical* identity —\n`pg_control_system().system_identifier` — can be read.\n\nOff by default: every mainstream managed PostgreSQL exposes the\nidentifier, but PostgreSQL-protocol engines that are not PostgreSQL\n(CockroachDB, Spanner's PostgreSQL interface, Redshift, Aurora DSQL) do\nnot implement it, and those targets run on the logical identity alone.\nSet it where a real PostgreSQL is expected and losing the strongest\nhalf of the target binding should stop reconciliation rather than\nsilently weaken it.",
                        "nullable": true,
                        "type": "boolean"
                      },
                      "secretKey": {
                        "description": "Key within the Secret to read. Defaults to `DATABASE_URL`.\nOnly used with `secretRef`.",
                        "nullable": true,
                        "type": "string"
                      },
                      "secretRef": {
                        "description": "Reference to a Kubernetes Secret containing a connection URL.\nMutually exclusive with `params`.",
                        "nullable": true,
                        "properties": {
                          "name": {
                            "description": "Name of the Secret.",
                            "maxLength": 253,
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": [
                          "name"
                        ],
                        "type": "object"
                      }
                    },
                    "type": "object"
                  },
                  "delegations": {
                    "default": [],
                    "description": "What each namespace may manage on this database. A policy from a\nnamespace no delegation names is rejected.",
                    "items": {
                      "description": "Authority the database owner grants to a set of namespaces.",
                      "properties": {
                        "name": {
                          "description": "Unique among this database's delegations. Attached policies' status\nnames the delegations that admitted them.",
                          "maxLength": 63,
                          "minLength": 1,
                          "type": "string"
                        },
                        "namespaces": {
                          "description": "Namespaces this delegation applies to; `*` matches every namespace.",
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "roles": {
                          "default": [],
                          "description": "Roles those namespaces may define or retire. A trailing `*` matches by\nprefix.",
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "schemas": {
                          "default": [],
                          "description": "Schema facets those namespaces may manage.",
                          "items": {
                            "description": "A schema and the facets of it a delegation covers.",
                            "properties": {
                              "facets": {
                                "description": "`owner` (create the schema and set its owner) and/or `bindings`\n(profiles, grants and default privileges on it).",
                                "items": {
                                  "enum": [
                                    "owner",
                                    "bindings"
                                  ],
                                  "type": "string"
                                },
                                "type": "array"
                              },
                              "name": {
                                "description": "Schema name.",
                                "type": "string"
                              }
                            },
                            "required": [
                              "facets",
                              "name"
                            ],
                            "type": "object"
                          },
                          "type": "array"
                        }
                      },
                      "required": [
                        "name",
                        "namespaces"
                      ],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "executorRole": {
                    "description": "The role the connection authenticates as. When set, the composed\npolicy declares its inherited membership in every role that owns a\nschema or default privileges. Teams then need not know the executor,\nand convergence does not revoke the membership `createrole_self_grant`\ngave it, which the executor needs to grant on those roles' objects.",
                    "nullable": true,
                    "type": "string"
                  },
                  "interval": {
                    "default": "5m",
                    "description": "Reconciliation interval for the composed policy.",
                    "type": "string"
                  },
                  "mode": {
                    "default": "apply",
                    "description": "`apply` executes the composed plan; `observe` only reports drift.",
                    "enum": [
                      "apply",
                      "observe",
                      "plan"
                    ],
                    "type": "string"
                  },
                  "profiles": {
                    "additionalProperties": {
                      "description": "A reusable privilege profile.",
                      "properties": {
                        "config": {
                          "additionalProperties": {
                            "description": "A role configuration parameter value.\n\nValues are always strings — quote numbers and booleans (e.g.\n`statement_timeout: \"30000\"`, `jit: \"off\"`). The Kubernetes CRD schema\ntypes config values as strings, and the CLI enforces the same rule so a\nmanifest means the same thing whether it is applied with `pgroles` or\n`kubectl`. PostgreSQL coerces the string to the parameter's type.",
                            "maxLength": 256,
                            "type": "string"
                          },
                          "description": "Role-level configuration parameter defaults for generated roles,\napplied via `ALTER ROLE ... SET parameter = value`. Values support the\n`{schema}` and `{profile}` placeholders, substituted per `schema x\nprofile` expansion (e.g. `search_path: \"{schema}\"`).",
                          "maxProperties": 32,
                          "type": "object"
                        },
                        "default_privileges": {
                          "default": [],
                          "description": "Privileges to grant on future objects created by the configured owner.",
                          "items": {
                            "description": "Default privilege grant within a profile.",
                            "properties": {
                              "ensure": {
                                "description": "Whether the privilege must be present or absent. Matches the\ntop-level `default_privileges` entries, which carry the same field.",
                                "enum": [
                                  "present",
                                  "absent"
                                ],
                                "type": "string"
                              },
                              "on_type": {
                                "description": "Kind of future object affected by the default privilege.",
                                "enum": [
                                  "table",
                                  "view",
                                  "materialized_view",
                                  "sequence",
                                  "function",
                                  "schema",
                                  "database",
                                  "type"
                                ],
                                "type": "string"
                              },
                              "privileges": {
                                "description": "PostgreSQL privileges to reconcile on the selected objects.",
                                "items": {
                                  "description": "PostgreSQL privilege types.",
                                  "enum": [
                                    "SELECT",
                                    "INSERT",
                                    "UPDATE",
                                    "DELETE",
                                    "TRUNCATE",
                                    "REFERENCES",
                                    "TRIGGER",
                                    "EXECUTE",
                                    "USAGE",
                                    "CREATE",
                                    "CONNECT",
                                    "TEMPORARY"
                                  ],
                                  "type": "string"
                                },
                                "maxItems": 16,
                                "minItems": 1,
                                "type": "array"
                              },
                              "role": {
                                "description": "Grantee role; omitted values use the generated profile role.",
                                "maxLength": 63,
                                "minLength": 1,
                                "nullable": true,
                                "type": "string"
                              }
                            },
                            "required": [
                              "on_type",
                              "privileges"
                            ],
                            "type": "object"
                          },
                          "maxItems": 32,
                          "type": "array"
                        },
                        "grants": {
                          "default": [],
                          "description": "Object privilege templates expanded for each bound schema.",
                          "items": {
                            "description": "Grant template within a profile.",
                            "properties": {
                              "ensure": {
                                "description": "Whether the privilege must be present or absent. Matches the top-level\n`grants` entries, which carry the same field. Profiles are additive\ntemplates, so validation rejects `absent`; the schema accepts it so the\nAPI server does not prune the value before that check can name it.",
                                "enum": [
                                  "present",
                                  "absent"
                                ],
                                "type": "string"
                              },
                              "object": {
                                "description": "Object kind and target to which the privileges apply.",
                                "properties": {
                                  "name": {
                                    "description": "Object name; omission selects the object-kind scope supported by the profile.",
                                    "maxLength": 256,
                                    "minLength": 1,
                                    "nullable": true,
                                    "type": "string"
                                  },
                                  "type": {
                                    "description": "PostgreSQL object kind.",
                                    "enum": [
                                      "table",
                                      "view",
                                      "materialized_view",
                                      "sequence",
                                      "function",
                                      "schema",
                                      "database",
                                      "type"
                                    ],
                                    "type": "string"
                                  }
                                },
                                "required": [
                                  "type"
                                ],
                                "type": "object"
                              },
                              "privileges": {
                                "description": "PostgreSQL privileges to reconcile on the selected objects.",
                                "items": {
                                  "description": "PostgreSQL privilege types.",
                                  "enum": [
                                    "SELECT",
                                    "INSERT",
                                    "UPDATE",
                                    "DELETE",
                                    "TRUNCATE",
                                    "REFERENCES",
                                    "TRIGGER",
                                    "EXECUTE",
                                    "USAGE",
                                    "CREATE",
                                    "CONNECT",
                                    "TEMPORARY"
                                  ],
                                  "type": "string"
                                },
                                "maxItems": 16,
                                "minItems": 1,
                                "type": "array"
                              }
                            },
                            "required": [
                              "object",
                              "privileges"
                            ],
                            "type": "object"
                          },
                          "maxItems": 64,
                          "type": "array"
                        },
                        "inherit": {
                          "description": "Whether privileges from role memberships are inherited automatically.",
                          "nullable": true,
                          "type": "boolean"
                        },
                        "login": {
                          "description": "Whether the role may initiate database sessions.",
                          "nullable": true,
                          "type": "boolean"
                        }
                      },
                      "type": "object"
                    },
                    "default": {},
                    "description": "Profiles every attached policy may bind.",
                    "type": "object"
                  },
                  "reconciliationMode": {
                    "default": "authoritative",
                    "description": "Convergence strategy for the composed policy.",
                    "enum": [
                      "authoritative",
                      "additive",
                      "adopt"
                    ],
                    "type": "string"
                  },
                  "rolePattern": {
                    "description": "Default role naming pattern for schema bindings.",
                    "nullable": true,
                    "type": "string"
                  }
                },
                "required": [
                  "connection"
                ],
                "type": "object"
              },
              "status": {
                "description": "Observed state of a `PostgresDatabase`.",
                "nullable": true,
                "properties": {
                  "acceptedPolicies": {
                    "default": 0,
                    "description": "Attached policies whose content is composed.",
                    "format": "int64",
                    "type": "integer"
                  },
                  "attached": {
                    "default": [],
                    "description": "Every policy attached to this database, in precedence order.",
                    "items": {
                      "description": "The outcome for one attached policy.",
                      "properties": {
                        "accepted": {
                          "description": "Whether the policy's current generation is composed.",
                          "type": "boolean"
                        },
                        "delegations": {
                          "description": "The delegations whose scope admitted the composed content.",
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "message": {
                          "description": "Details of the rejection.",
                          "nullable": true,
                          "type": "string"
                        },
                        "name": {
                          "description": "Name of the attached `PostgresPolicy`.",
                          "type": "string"
                        },
                        "namespace": {
                          "description": "Namespace of the attached `PostgresPolicy`.",
                          "type": "string"
                        },
                        "reason": {
                          "description": "Why the current generation was rejected.",
                          "nullable": true,
                          "type": "string"
                        },
                        "servingContent": {
                          "description": "The content of `servingGeneration`, kept so a rejected edit can fall\nback to it.",
                          "nullable": true,
                          "type": "string"
                        },
                        "servingGeneration": {
                          "description": "The generation whose content is composed: the current one when\naccepted, an earlier one while a newer edit is rejected.",
                          "format": "int64",
                          "nullable": true,
                          "type": "integer"
                        },
                        "uid": {
                          "description": "UID of the attached `PostgresPolicy`. Retained content belongs to this\nobject: a policy deleted and re-created under the same name starts\nafresh.",
                          "nullable": true,
                          "type": "string"
                        }
                      },
                      "required": [
                        "accepted",
                        "name",
                        "namespace"
                      ],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "composedPolicy": {
                    "description": "The operator-owned `PostgresPolicy` carrying the composition.",
                    "nullable": true,
                    "type": "string"
                  },
                  "conditions": {
                    "default": [],
                    "description": "Standard Kubernetes conditions; `Ready` mirrors the composed policy.",
                    "items": {
                      "description": "A condition on the `PostgresPolicy` resource.",
                      "properties": {
                        "last_transition_time": {
                          "description": "Last time the condition transitioned.",
                          "nullable": true,
                          "type": "string"
                        },
                        "message": {
                          "description": "Human-readable message.",
                          "nullable": true,
                          "type": "string"
                        },
                        "reason": {
                          "description": "Human-readable reason for the condition.",
                          "nullable": true,
                          "type": "string"
                        },
                        "status": {
                          "description": "Status: \"True\", \"False\", or \"Unknown\".",
                          "type": "string"
                        },
                        "type": {
                          "description": "Controller-defined condition type, such as Ready, Reconciling, or Degraded.\nThis is an open vocabulary; consult status guidance for operational meanings.",
                          "type": "string"
                        }
                      },
                      "required": [
                        "status",
                        "type"
                      ],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "rejectedPolicies": {
                    "default": 0,
                    "description": "Attached policies with no content composed.",
                    "format": "int64",
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": [
              "spec"
            ],
            "title": "PostgresDatabase",
            "type": "object"
          }
        },
        "served": true,
        "storage": true,
        "subresources": {
          "status": {}
        }
      }
    ]
  }
}
