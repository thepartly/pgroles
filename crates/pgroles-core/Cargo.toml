[package]
name = "pgroles-core"
description = "Core manifest, diff, SQL rendering, and export primitives for pgroles"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["passwords"]
passwords = ["dep:base64", "dep:hmac", "dep:pbkdf2", "dep:rand", "dep:zeroize"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }

# SCRAM-SHA-256 verifier computation
sha2 = "0.11"
hmac = { version = "0.13", optional = true }
pbkdf2 = { version = "0.13.0", optional = true }
base64 = { version = "0.22.1", optional = true }
rand = { version = "0.10.1", optional = true }
zeroize = { version = "1", optional = true }
