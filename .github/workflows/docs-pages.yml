name: Docs Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "crates/pgroles-core/**"
      - "crates/pgroles-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check-manifest-metadata.sh"
      - "scripts/generate-manifest-metadata.sh"
      - ".github/workflows/docs-pages.yml"
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
    paths:
      - "docs/**"
      - "crates/pgroles-core/**"
      - "crates/pgroles-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check-manifest-metadata.sh"
      - "scripts/generate-manifest-metadata.sh"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

concurrency:
  # Serialize updates and cleanup for each preview without letting unrelated
  # pull requests cancel one another. Production remains a separate lane.
  group: >-
    pgroles-docs-${{
      github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || github.event_name == 'push'
      && 'production'
      || format('manual-{0}', github.run_id)
    }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    # Skipped rather than failed where the install can't authenticate: neither
    # a fork nor Dependabot receives the @partly registry token.
    if: >-
      (github.event_name != 'pull_request' || github.event.action != 'closed')
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
          registry-url: https://registry.npmjs.org

      - uses: dtolnay/rust-toolchain@1.94.0

      - name: Verify generated manifest metadata
        run: scripts/check-manifest-metadata.sh
        working-directory: ${{ github.workspace }}

      - name: Install active toolchain WASM target
        run: rustup target add wasm32-unknown-unknown
        working-directory: ${{ github.workspace }}

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
        working-directory: ${{ github.workspace }}

      - name: Build browser analyzer
        run: >-
          wasm-pack build crates/pgroles-wasm
          --target web
          --release
          --out-dir ../../docs/public/wasm
        working-directory: ${{ github.workspace }}

      # The docs depend on @partly/pitstop, a restricted package, so the
      # install needs a token with read access to the @partly scope. Pull
      # requests from forks do not get the secret and cannot build the docs.
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run lab exercises against PGlite
        run: npm run test:labs

      - name: Verify explorer bridge
        run: npm run test:explorer

      - name: Install browser for explorer tests
        run: npx playwright install --with-deps chromium

      - name: Verify generated reference rendering
        working-directory: docs
        run: npm run test:reference

      - name: Verify documentation link routing
        working-directory: docs
        run: npm run test:routing

      - name: Build static export
        env:
          DOCS_BASE_PATH: >-
            ${{
              github.event_name == 'pull_request'
              && format('{0}/pr-preview/pr-{1}', steps.pages.outputs.base_path, github.event.pull_request.number)
              || steps.pages.outputs.base_path
            }}
        run: npm run build

      - name: Assert exported WASM assets
        run: |
          rm -f out/wasm/.gitignore
          test -s out/wasm/pgroles_wasm.js
          test -s out/wasm/pgroles_wasm_bg.wasm

      - name: Verify exported WASM assets stage for Git deployment
        run: |
          stage_dir="$(mktemp -d)"
          git init -q "$stage_dir"
          cp -R out/wasm "$stage_dir/wasm"
          git -C "$stage_dir" add --dry-run wasm/pgroles_wasm.js wasm/pgroles_wasm_bg.wasm | grep -F 'pgroles_wasm.js'
          git -C "$stage_dir" add --dry-run wasm/pgroles_wasm.js wasm/pgroles_wasm_bg.wasm | grep -F 'pgroles_wasm_bg.wasm'

      - name: Run explorer browser tests against static export
        env:
          DOCS_TEST_BASE_PATH: >-
            ${{
              github.event_name == 'pull_request'
              && format('{0}/pr-preview/pr-{1}', steps.pages.outputs.base_path, github.event.pull_request.number)
              || steps.pages.outputs.base_path
            }}
        run: npm run test:browser

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: pgroles-docs-${{ github.run_id }}
          path: docs/out
          include-hidden-files: true
          if-no-files-found: error

  preview:
    name: Deploy docs preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # All three gh-pages writers share one job-level group so pushes to the
    # branch are serialized across otherwise-parallel workflow runs.
    concurrency:
      group: pgroles-docs-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: pgroles-docs-${{ github.run_id }}
          path: site

      - name: Publish pull request preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: "false"

  remove-preview:
    name: Remove docs preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: pgroles-docs-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Remove pull request preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: remove
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: "false"

  deploy:
    name: Deploy docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pgroles-docs-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: pgroles-docs-${{ github.run_id }}
          path: site

      - name: Publish production site
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: site
          clean-exclude: |
            pr-preview
            README.md
            index.yaml
          force: false
