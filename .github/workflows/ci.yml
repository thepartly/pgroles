name: CI

on:
  push:
    # release/** so a release branch gets the full suite on its own pushes, and
    # so the commit a release tag will point at has a successful push run for
    # release.yml's candidate-ci gate to find.
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: Decide whether this run needs the expensive suite.
  #
  # In a stacked pull request the top entry contains the full changeset, so the
  # integration matrix, Docker/example smoke tests, and kind-based E2E jobs only
  # need to run there — once per stack rather than once per entry. Lint and unit
  # tests stay ungated so every entry still gets fast feedback.
  #
  # Deliberately fail-safe: `stack` is null for pushes and for ordinary
  # non-stacked pull requests, and anything we cannot positively identify as a
  # non-top stack entry runs the full suite.
  # ---------------------------------------------------------------------------
  stack-gate:
    name: Stack Gate
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.decide.outputs.run_heavy }}
    steps:
      - id: decide
        env:
          IS_TOP_OR_UNSTACKED: >-
            ${{ github.event.pull_request.stack == null
                || github.event.pull_request.stack.position == github.event.pull_request.stack.size }}
          STACK_POSITION: ${{ github.event.pull_request.stack.position }}
          STACK_SIZE: ${{ github.event.pull_request.stack.size }}
        run: |
          # Stacked pull requests are in public preview, so assert the metadata
          # semantics this gate depends on: `position` is documented as 1-based
          # with 1 at the bottom, and the top entry is `position == size`. If
          # that ever changes, `position == size` would silently be false for the
          # real top entry and the whole stack could merge without the expensive
          # suite ever running. Fail loudly instead of skipping wrongly.
          if [ -n "$STACK_POSITION" ] || [ -n "$STACK_SIZE" ]; then
            if [ -z "$STACK_POSITION" ] || [ -z "$STACK_SIZE" ]; then
              echo "::error::stack metadata is partially populated" \
                "(position='$STACK_POSITION' size='$STACK_SIZE'); refusing to gate on it"
              exit 1
            fi
            # Validate before comparing. `[ non-numeric -lt 1 ]` writes
            # "integer expression expected" to stderr and evaluates *false*,
            # which does not trip `bash -e` inside an `if` condition — so an
            # unchecked comparison would let the step continue and skip the
            # expensive suite, the exact failure this guard exists to prevent.
            for value in "$STACK_POSITION" "$STACK_SIZE"; do
              case "$value" in
                ''|*[!0-9]*)
                  echo "::error::stack metadata is not a non-negative integer" \
                    "(position='$STACK_POSITION' size='$STACK_SIZE');" \
                    "refusing to gate on it"
                  exit 1
                  ;;
              esac
            done
            # 10# forces decimal, so a zero-padded value is never read as octal.
            if [ "$((10#$STACK_POSITION))" -lt 1 ] \
              || [ "$((10#$STACK_POSITION))" -gt "$((10#$STACK_SIZE))" ]; then
              echo "::error::stack position $STACK_POSITION outside the documented" \
                "1..$STACK_SIZE range; the top-of-stack test in this workflow is no" \
                "longer valid and must be revisited"
              exit 1
            fi
          fi

          echo "run_heavy=$IS_TOP_OR_UNSTACKED" >> "$GITHUB_OUTPUT"
          if [ "$IS_TOP_OR_UNSTACKED" = "true" ]; then
            echo "Running the full suite (not a non-top stack entry)."
          else
            echo "::notice::Skipping the expensive suite: stack entry" \
              "$STACK_POSITION of $STACK_SIZE. The top entry runs it for the whole stack."
          fi

  # ---------------------------------------------------------------------------
  # Job 1: Lint — clippy, rustfmt, CRD drift check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-deny
        run: cargo install cargo-deny@0.19.0 --locked

      - name: Check dependencies
        run: cargo deny check

      - name: CRD drift check
        run: scripts/check-crd-drift.sh

      - name: CRD reference drift and description coverage
        run: scripts/check-crd-docs.sh

      - name: Chart README drift check
        run: scripts/check-helm-docs.sh

      - name: Kyverno policy mirror drift check
        run: scripts/check-kyverno-drift.sh

      - uses: azure/setup-helm@v5

      - name: Kyverno operator exemption check
        run: scripts/check-kyverno-operator-exemption.sh

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Validate Agent Skills
        run: |
          test -f skills/pgroles-policy/SKILL.md
          test -f skills/pgroles-operator/SKILL.md
          test "$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq \
            "$(find skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)"
          find skills -mindepth 2 -maxdepth 2 -name SKILL.md -print0 \
            > /tmp/pgroles-agent-skills
          test -s /tmp/pgroles-agent-skills
          while IFS= read -r -d '' skill_file; do
            uvx --from skills-ref==0.1.1 \
              agentskills validate "$(dirname "$skill_file")"
          done < /tmp/pgroles-agent-skills

  monitoring:
    name: Monitoring examples
    needs: stack-gate
    if: needs.stack-gate.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build production telemetry smoke emitter
        run: cargo build --locked -p pgroles-operator --example telemetry-smoke
      - name: Test alert timing and missing telemetry
        run: scripts/check-monitoring.sh
      - name: Install kind
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          echo "b89aada5a39d620da3fcd16435b7f28d858927dd53f92cbac77686b0588b600d  /tmp/kind" | sha256sum -c -
          sudo install /tmp/kind /usr/local/bin/kind
      - name: Verify resource-state extraction and Collector output
        run: scripts/check-monitoring-e2e.sh

  # ---------------------------------------------------------------------------
  # Job 2: Unit tests
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Job 3: Integration tests — with a live PostgreSQL
  # ---------------------------------------------------------------------------
  integration-test:
    name: Integration Tests (${{ matrix.database.name }})
    needs: stack-gate
    if: needs.stack-gate.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # AlloyDB Omni is the containerised AlloyDB engine — the closest CI can
        # get to the managed service, and close enough to catch engine-level
        # divergence (catalog shape, pg_control_system, default GUCs).
        database:
          - { name: "PG16", image: "postgres:16" }
          - { name: "PG17", image: "postgres:17" }
          - { name: "PG18", image: "postgres:18" }
          - { name: "AlloyDB Omni 16", image: "google/alloydbomni:16" }
    services:
      postgres:
        image: ${{ matrix.database.image }}
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: pgroles_test
        ports:
          - 5432:5432
        # --shm-size for AlloyDB Omni's shared-memory appetite; harmless for
        # the vanilla postgres images. The generous retry budget is also for
        # Omni: its first boot reinstalls extensions and runs a post-startup
        # script before the real server start, which overruns the ~50s window
        # that suits the vanilla images.
        #
        # The probe goes over TCP loopback deliberately: Omni's unix socket
        # does not live where pg_isready looks by default (a socket probe
        # never succeeds, so the runner declared the container unhealthy just
        # as its init finished), and the vanilla images' init-phase temp
        # server is socket-only, so TCP also cannot report healthy before the
        # real server is up.
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -p 5432 -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=48
          --shm-size=1g
    env:
      DATABASE_URL: "postgres://postgres:testpassword@localhost:5432/pgroles_test"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # POSTGRES_DB is a docker-entrypoint convention the postgres images
      # honour; do not assume every engine image does. Create the test
      # database explicitly if the entrypoint did not.
      - name: Ensure test database exists
        run: |
          docker exec ${{ job.services.postgres.id }} \
            psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='pgroles_test'" | grep -q 1 || \
          docker exec ${{ job.services.postgres.id }} \
            createdb -U postgres pgroles_test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run integration tests (including ignored)
        run: cargo test --workspace -- --include-ignored

  # ---------------------------------------------------------------------------
  # Job 4: Docker smoke tests — verify doc examples work
  # ---------------------------------------------------------------------------
  docker-smoke:
    name: Docker Smoke Tests
    needs: stack-gate
    if: needs.stack-gate.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: pgroles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: "postgres://postgres:testpassword@localhost:5432/pgroles_test"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build CLI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: cli
          load: true
          tags: pgroles:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Smoke: --help via entrypoint"
        run: docker run --rm pgroles:smoke --help

      - name: "Smoke: volume mount + validate"
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tests/fixtures:/work" \
            pgroles:smoke \
            validate -f smoke-test.yaml

      - name: "Smoke: volume mount + diff against live DB"
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -v "${{ github.workspace }}/tests/fixtures:/work" \
            pgroles:smoke \
            diff -f smoke-test.yaml --no-exit-code

      - name: "Smoke: derived image builds and runs"
        run: |
          printf 'FROM pgroles:smoke\nCOPY tests/fixtures/smoke-test.yaml .\n' > /tmp/Dockerfile.derived
          docker build -f /tmp/Dockerfile.derived -t pgroles:derived .
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            pgroles:derived \
            diff -f smoke-test.yaml --no-exit-code

  # ---------------------------------------------------------------------------
  # Job 4b: Example smoke tests — verify executable examples against PostgreSQL
  # ---------------------------------------------------------------------------
  example-smoke:
    name: Example Smoke Tests
    needs: stack-gate
    if: needs.stack-gate.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: pgroles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: "postgres://postgres:testpassword@localhost:5432/pgroles_test"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run multi-service microservices example
        run: scripts/test-microservices-example.sh

  # ---------------------------------------------------------------------------
  # Job 5a: E2E — Operator Scenarios
  # ---------------------------------------------------------------------------
  e2e-operator:
    name: "E2E: Operator Scenarios"
    needs: stack-gate
    if: needs.stack-gate.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-e2e
        with:
          cluster-name: pgroles-e2e-operator

      - name: Run the documented operator quick start
        run: scripts/e2e-doc-quick-start.sh

      - name: Run operator scenarios
        run: |
          source scripts/e2e-helpers.sh

          kubectl delete pgr basic-policy --wait=true

          kubectl apply -f k8s/samples/disjoint-policy.yaml
          wait_for_ready_true disjoint-policy
          assert_role_exists analytics
          # This fixture deliberately omits spec.approval, so it must report the
          # deprecation condition while the inference still exists.
          wait_for_condition_status disjoint-policy ApprovalUnset True

          pg_query 'DROP SCHEMA IF EXISTS operator_owned_schema CASCADE; DROP ROLE IF EXISTS operator_schema_owner;'
          kubectl apply -f k8s/samples/schema-owner-policy.yaml
          wait_for_ready_true schema-owner-policy
          # ...whereas this one sets it explicitly and must stay quiet.
          assert_condition_absent schema-owner-policy ApprovalUnset
          assert_role_exists operator_schema_owner
          assert_schema_exists operator_owned_schema
          assert_schema_owner operator_owned_schema operator_schema_owner

          kubectl apply -f k8s/samples/second-disjoint-policy.yaml
          wait_for_ready_true second-disjoint-policy
          assert_role_exists reporting

          upsert_secret postgres-credentials \
            DATABASE_URL='postgres://postgres:devpassword@postgres.default.svc.cluster.local:15432/postgres'
          wait_for_ready_reason disjoint-policy DatabaseConnectionFailed
          wait_for_ready_reason second-disjoint-policy DatabaseConnectionFailed

          upsert_secret postgres-credentials \
            DATABASE_URL='postgres://postgres:devpassword@postgres.default.svc.cluster.local:5432/postgres'
          wait_for_ready_true disjoint-policy
          wait_for_ready_true second-disjoint-policy

          kubectl apply -f k8s/samples/conflicting-policy.yaml
          wait_for_ready_reason conflicting-policy ConflictingPolicy
          wait_for_event_reason conflicting-policy ConflictDetected

          kubectl apply -f k8s/samples/invalid-policy.yaml
          wait_for_ready_reason invalid-policy InvalidSpec

          echo "--- Test: database grants require the connected database ---"
          if kubectl apply -f - <<'YAML'
          apiVersion: pgroles.io/v1alpha1
          kind: PostgresPolicy
          metadata:
            name: unnamed-database-target-policy
          spec:
            connection:
              secretRef:
                name: postgres-credentials
            grants:
              - role: PUBLIC
                ensure: absent
                privileges: [CONNECT]
                object: {type: database}
          YAML
          then
            echo "::error::CRD admission accepted a database grant without object.name"
            exit 1
          fi

          kubectl apply -f - <<'YAML'
          apiVersion: pgroles.io/v1alpha1
          kind: PostgresPolicy
          metadata:
            name: invalid-database-target-policy
          spec:
            connection:
              secretRef:
                name: postgres-credentials
            interval: "5m"
            grants:
              - role: PUBLIC
                ensure: absent
                privileges: [CONNECT]
                object: {type: database, name: not_the_connected_database}
          YAML
          wait_for_ready_reason invalid-database-target-policy InvalidDatabaseTarget
          wait_for_last_error_contains invalid-database-target-policy \
            'does not match connected database "postgres"'

          kubectl apply -f k8s/samples/missing-secret-policy.yaml
          wait_for_ready_reason missing-secret-policy SecretFetchFailed
          wait_for_event_reason missing-secret-policy SecretFetchFailed

          kubectl apply -f k8s/samples/insufficient-privileges-policy.yaml
          # PlanRetryDeferred, not InsufficientPrivileges: the first attempt
          # reports the SQL error, then the retry back-off engages and the
          # reason settles there for the rest of the window. Asserting the
          # first-attempt reason would be racing a state that lasts
          # milliseconds. The cause is not lost — the back-off carries the
          # original error verbatim, which the lastError assertion checks.
          wait_for_ready_reason insufficient-privileges-policy PlanRetryDeferred
          wait_for_last_error_contains insufficient-privileges-policy "permission denied to create role"
          assert_role_absent insufficient-privileges-user

          # A permanently-failing policy must not spin. This one is never
          # deleted, so it stays in the cluster for every scenario below, and
          # it shares a database with them — the advisory lock key is derived
          # server-side from `current_database()`, so every policy pointed at
          # this server contends for one lock.
          #
          # Any write to a plan wakes the policy that owns it, so a retry that
          # writes before it backs off schedules its own next attempt. Left
          # unbounded that is several reconciles a second, each one taking the
          # shared lock, and the policies sharing this database lose it
          # repeatedly until their waits time out. Nothing else in this suite
          # asserts a rate, so nothing else catches it.
          #
          # At the policy interval this should be 0 or 1 in a 20s window. The
          # bound is loose because the point is to catch a storm, not to pin a
          # cadence: the unbounded retry produced ~190.
          echo "--- Test: a permanently-failing policy does not spin ---"
          # Count by differencing two whole-log reads of one pod. Two things
          # this must not do:
          #
          #   `--since` — observed returning nothing on kind for windows that
          #   covered the pod's entire lifetime, while an unwindowed read of
          #   the same pod a second later returned ~130 matching lines. A
          #   silently empty read makes the assertion below pass vacuously.
          #
          #   `deployment/...` — resolves to one arbitrary pod, which is
          #   ambiguous while the previous ReplicaSet's pod still exists.
          #
          # Differencing needs neither server-side time filtering nor any
          # comparison between the runner's clock and the node's.
          operator_pod="$(kubectl -n pgroles-system get pod \
            -l app.kubernetes.io/name=pgroles-operator \
            --field-selector=status.phase=Running \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{.items[-1:].metadata.name}')"
          test -n "$operator_pod" || { echo "::error::could not resolve the operator pod"; exit 1; }
          count_reconciles() {
            kubectl -n pgroles-system logs "pod/${operator_pod}" --tail=-1 \
              | grep -c 'starting reconciliation.*insufficient-privileges-policy' || true
          }
          # Guard against a vacuous pass: the policy has already reconciled at
          # least once (its Ready condition and lastError were asserted just
          # above), so a zero baseline means the log format drifted or the
          # wrong pod was read — the spin assertion below would then pass
          # while measuring nothing.
          baseline="$(count_reconciles)"
          if [ "$baseline" -eq 0 ]; then
            echo "::error::no reconcile log lines matched for insufficient-privileges-policy; the spin assertion below would pass without measuring anything"
            exit 1
          fi
          sleep 20
          after="$(count_reconciles)"
          if [ "$after" -lt "$baseline" ]; then
            echo "::error::reconcile count went backwards (${baseline} -> ${after}); the operator restarted or its log rotated mid-window, so the spin rate cannot be measured"
            exit 1
          fi
          spin_count=$((after - baseline))
          echo "insufficient-privileges-policy reconciled ${spin_count} times in 20s"
          if [ "$spin_count" -gt 5 ]; then
            echo "::error::failing policy reconciled ${spin_count} times in 20s (>5): it is self-waking and will starve other policies on this database"
            kubectl -n pgroles-system logs "pod/${operator_pod}" --tail=40 || true
            exit 1
          fi

          # The deprecated `mode: plan` spelling stays accepted — a GitOps
          # controller re-applies existing manifests on every sync, so the
          # rename must not reject them — behaves exactly as observe, and
          # says so on a condition.
          kubectl apply -f - <<'LEGACY'
          apiVersion: pgroles.io/v1alpha1
          kind: PostgresPolicy
          metadata:
            name: legacy-plan-mode-policy
            namespace: default
          spec:
            connection:
              secretRef:
                name: postgres-credentials
            mode: plan
            interval: 30s
            roles:
              - name: legacy_plan_mode_user
                login: false
          LEGACY
          wait_for_ready_status_reason legacy-plan-mode-policy True Planned
          wait_for_condition_status legacy-plan-mode-policy ModeValueDeprecated True
          kubectl get pgr legacy-plan-mode-policy -o jsonpath='{.spec.mode}' | grep -qx "plan"
          assert_role_absent legacy_plan_mode_user
          kubectl delete pgr legacy-plan-mode-policy --wait=true

          kubectl apply -f k8s/samples/observe-policy.yaml
          wait_for_ready_status_reason observe-policy True Planned
          wait_for_drift_status observe-policy True
          kubectl get pgr observe-policy -o jsonpath='{.status.last_reconcile_mode}' | grep -qx "observe"
          plan_preview_plan="$(wait_for_current_plan_ref observe-policy)"
          get_plan_sql "$plan_preview_plan" | grep -q 'CREATE ROLE \"observe-preview-user\"'
          assert_role_absent observe-preview-user
          wait_for_event_reason observe-policy DriftDetected

          # Approving an observe-mode plan can never execute. The policy must say
          # so rather than look stalled, and must still not touch the database.
          assert_condition_absent observe-policy ApprovalIgnored
          approve_plan "$plan_preview_plan"
          wait_for_condition_status observe-policy ApprovalIgnored True
          wait_for_event_reason observe-policy ApprovalIgnored
          assert_role_absent observe-preview-user

          # A decision is terminal, so there is no un-approving: removing the
          # retired annotation is a no-op, and the warning must persist rather
          # than clear. This previously deleted `pgroles.io/approved` and waited
          # for ApprovalIgnored to disappear — the mutable-annotation model that
          # write-once decisions replaced.
          kubectl annotate pgplan "$plan_preview_plan" pgroles.io/approved- --overwrite || true
          wait_for_condition_status observe-policy ApprovalIgnored True
          assert_role_absent observe-preview-user

          # The write-once rules are the API server's own CEL, not the operator
          # and not an admission add-on — so they must hold even for
          # cluster-admin. Each of these writes is the attack the rule exists
          # to stop: flipping a recorded decision, erasing the decider, and
          # repointing an approval at different effects or a different server.
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if kubectl patch pgplan "$plan_preview_plan" --subresource=status --type=merge -p '{
              "status": {
                "conditions": [{"type": "Denied", "status": "True",
                  "reason": "Flipped", "message": "decision flip must be rejected",
                  "lastTransitionTime": "'"$now"'"}],
                "decidedBy": {"username": "e2e-reviewer"}
              }
            }'; then
            echo "::error::flipping a terminal Approved decision to Denied was accepted"
            exit 1
          fi
          if kubectl patch pgplan "$plan_preview_plan" --subresource=status --type=merge \
            -p '{"status":{"decidedBy":{"username":"replacement-reviewer"}}}'; then
            echo "::error::rewriting the write-once decision identity was accepted"
            exit 1
          fi
          if kubectl patch pgplan "$plan_preview_plan" --subresource=status --type=merge \
            -p '{"status":{"changeDigest":"sha256:forged"}}'; then
            echo "::error::rewriting the approval-binding changeDigest was accepted"
            exit 1
          fi
          if kubectl patch pgplan "$plan_preview_plan" --subresource=status --type=merge \
            -p '{"status":{"targetPhysicalIdentity":"7000000000000000000"}}'; then
            echo "::error::rewriting the bound target identity was accepted"
            exit 1
          fi
          # And the decision the failed writes attacked is still intact.
          test "$(kubectl get pgplan "$plan_preview_plan" -o jsonpath='{.status.decidedBy.username}')" = "e2e-reviewer"

          upsert_secret rotating-postgres-credentials \
            DATABASE_URL='postgres://postgres:devpassword@postgres.default.svc.cluster.local:5432/postgres'
          kubectl apply -f k8s/samples/rotated-secret-policy.yaml
          wait_for_ready_true rotated-secret-policy

          upsert_secret rotating-postgres-credentials \
            DATABASE_URL='postgres://postgres:devpassword@postgres.default.svc.cluster.local:15432/postgres'
          wait_for_ready_reason rotated-secret-policy DatabaseConnectionFailed

          upsert_secret rotating-postgres-credentials \
            DATABASE_URL='postgres://postgres:devpassword@postgres.default.svc.cluster.local:5432/postgres'
          wait_for_ready_true rotated-secret-policy
          wait_for_event_reason rotated-secret-policy Recovered

          # ----------------------------------------------------------------
          # Structured params connection mode (#86): create, verify, rotate credentials
          # ----------------------------------------------------------------
          upsert_secret params-pg-credentials username=postgres password=devpassword
          kubectl apply -f k8s/samples/params-e2e-policy.yaml
          wait_for_ready_true params-e2e-policy

          assert_role_exists params-test-role
          echo "params-mode: basic reconciliation works"

          # Rotate credential Secret to bad password — should fail to connect
          upsert_secret params-pg-credentials username=postgres password=wrongpassword
          wait_for_ready_reason params-e2e-policy DatabaseConnectionFailed
          echo "params-mode: credential rotation detected (bad password)"

          # Rotate back to correct password — should recover
          upsert_secret params-pg-credentials username=postgres password=devpassword
          wait_for_ready_true params-e2e-policy
          wait_for_event_reason params-e2e-policy Recovered
          echo "params-mode: credential rotation recovery works"

          # ----------------------------------------------------------------
          # Long dotted identifier: the API server is the oracle for every name
          # and label value the operator derives from a policy name.
          # ----------------------------------------------------------------
          # This is the maximum legal 253-byte DNS subdomain. Its 215th byte is
          # a dot, exactly where generate_plan_name truncates its prefix. The
          # operator must trim that exposed separator, create a legal plan, and
          # find it again even though the policy label is necessarily lossy.
          kubectl apply -f k8s/samples/max-length-name-policy.yaml
          # Read the name back from the applied object rather than repeating the
          # literal, so renaming the fixture cannot leave this waiting forever on
          # a policy that was never created.
          limit_name="$(kubectl get -f k8s/samples/max-length-name-policy.yaml \
            -o jsonpath='{.metadata.name}')"
          [ -n "$limit_name" ] \
            || { echo "::error::could not read the max-length policy name"; exit 1; }
          wait_for_ready_status_reason "$limit_name" True Planned

          plan="$(wait_for_current_plan_ref "$limit_name")"
          policy_uid="$(kubectl get pgr "$limit_name" -o jsonpath='{.metadata.uid}')"
          plan_owner_uid="$(kubectl get pgplan "$plan" \
            -o jsonpath='{.metadata.ownerReferences[?(@.controller==true)].uid}')"
          # jsonpath prints nothing when the path matches nothing, so require a
          # value before comparing: two empty strings must not read as a match.
          [ -n "$policy_uid" ] && [ -n "$plan_owner_uid" ] \
            || { echo "::error::missing policy or plan owner UID"; exit 1; }
          [ "$plan_owner_uid" = "$policy_uid" ] \
            || { echo "::error::long-name plan is not owned by its policy UID"; exit 1; }

          # The API server accepting the objects is the definitive syntax check;
          # retain explicit assertions so a future fixture change cannot make
          # this boundary case vacuous.
          test "${#limit_name}" -eq 253
          case "$plan" in
            -*|*-|*.|.*|*..*) echo "::error::invalid plan name: $plan"; exit 1 ;;
          esac
          policy_label="$(kubectl get pgplan "$plan" \
            -o jsonpath='{.metadata.labels.pgroles\.io/policy}')"
          test "${#policy_label}" -eq 63 \
            || { echo "::error::expected a truncated 63-byte policy label"; exit 1; }
          identity_label="$(kubectl get pgplan "$plan" \
            -o jsonpath='{.metadata.labels.pgroles\.io/database-identity}')"
          case "$identity_label" in
            *[!a-zA-Z0-9]) echo "::error::identity label ends non-alphanumeric: $identity_label"; exit 1 ;;
          esac
          echo "long-identifier: 253-byte dotted policy reconciled with valid derived identifiers"

          kubectl delete pgr "$limit_name" --wait=true

          # ----------------------------------------------------------------
          # Password lifecycle (#46): create with Secret, verify, rotate
          # ----------------------------------------------------------------
          upsert_secret role-passwords password-user='e2e_initial_pw!'
          kubectl apply -f k8s/samples/password-policy.yaml
          wait_for_ready_true password-policy

          assert_role_exists password-user
          assert_password_set password-user
          initial_hash="$(get_password_hash password-user)"
          pg_query "SELECT rolvaliduntil FROM pg_authid WHERE rolname = 'password-user'" | grep -q "2099-12-31"
          assert_operator_logs_clean 'e2e_initial_pw!'

          upsert_secret role-passwords password-user='e2e_rotated_pw!'
          wait_for_password_hash_change password-user "$initial_hash"

          # ----------------------------------------------------------------
          # Generated password lifecycle: create, remain stable, recreate
          # ----------------------------------------------------------------
          kubectl apply -f k8s/samples/generated-password-policy.yaml
          wait_for_ready_true generated-password-policy

          assert_role_exists genuser
          assert_password_set genuser
          assert_secret_has_keys generated-password-policy-pgr-genuser password verifier
          generated_initial_hash="$(get_password_hash genuser)"
          wait_for_password_hash_stable genuser "$generated_initial_hash"

          kubectl delete secret generated-password-policy-pgr-genuser --wait=true
          # Wait for the operator to reconcile and regenerate the secret.
          for i in $(seq 1 30); do
            if kubectl get secret generated-password-policy-pgr-genuser -o name 2>/dev/null; then
              break
            fi
            echo "Waiting for secret regeneration... (attempt $i/30)"
            sleep 3
          done
          wait_for_ready_true generated-password-policy
          assert_secret_has_keys generated-password-policy-pgr-genuser password verifier
          wait_for_password_hash_change genuser "$generated_initial_hash"

          # Verify ownerReference GC: deleting the CR should garbage-collect the generated Secret
          kubectl delete pgr generated-password-policy --wait=true
          kubectl wait --for=delete secret/generated-password-policy-pgr-genuser --timeout=30s \
            && echo "Generated Secret was garbage-collected on CR deletion" \
            || { echo "::error::Generated Secret was NOT garbage-collected"; exit 1; }

          # ----------------------------------------------------------------
          # Password secret resolution errors (#43)
          # ----------------------------------------------------------------
          kubectl apply -f k8s/samples/missing-password-secret-policy.yaml
          wait_for_ready_reason missing-password-secret-policy SecretFetchFailed

          upsert_secret nonexistent-password-secret missing-pw-user='fixed_pw!'
          wait_for_ready_true missing-password-secret-policy
          assert_role_exists missing-pw-user
          wait_for_event_reason missing-password-secret-policy Recovered

          upsert_secret empty-password-secret empty-pw-user=''
          kubectl apply -f k8s/samples/empty-password-secret-policy.yaml
          wait_for_ready_reason empty-password-secret-policy InvalidSpec
          wait_for_last_error_contains empty-password-secret-policy "password is empty"

          upsert_secret empty-password-secret empty-pw-user='now_has_password!'
          wait_for_ready_true empty-password-secret-policy
          assert_role_exists empty-pw-user
          assert_password_set empty-pw-user
          wait_for_event_reason empty-password-secret-policy Recovered

          # The broadest set of scenarios in the repository, and until now none
          # of them could tell a healthy operator from one that was killed and
          # restarted part way through reaching the same end state.
          assert_operator_healthy

      - name: Verify OTLP metrics reach the collector
        run: |
          for i in $(seq 1 30); do
            LOGS="$(kubectl -n pgroles-system logs deployment/otel-collector --tail=2000 2>/dev/null || true)"
            printf '%s\n' "$LOGS" | grep -q 'pgroles.policy.conflicts\|pgroles.apply.total\|pgroles.plan.total' && \
            printf '%s\n' "$LOGS" | grep -q 'pgroles.apply.statements\|pgroles.plan.changes' && \
            printf '%s\n' "$LOGS" | grep -q '"otelcol.component.kind": "exporter"' && {
              echo "Collector received operator metrics"
              exit 0
            }
            echo "Waiting for OTLP metrics export... (attempt $i/30)"
            sleep 5
          done
          echo "::error::Collector did not receive expected operator metrics"
          kubectl -n pgroles-system logs deployment/pgroles-operator --tail=100
          kubectl -n pgroles-system logs deployment/otel-collector --tail=200
          exit 1

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pgr,pgplan,pgcand,pgeap,pgear -A -o wide || true
          kubectl get pgr,pgplan,pgcand -A -o yaml | head -c 200000 || true
          kubectl -n pgroles-system logs deployment/pgroles-operator --tail=2000 || true
          kubectl -n pgroles-system logs deployment/pgroles-operator --previous --tail=2000 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true

      - name: Cleanup
        if: always()
        run: kind delete cluster --name pgroles-e2e-operator

  # ---------------------------------------------------------------------------
  # Job 5b: E2E — Load Tests
  # ---------------------------------------------------------------------------
  e2e-load:
    name: "E2E: Load Tests"
    needs: stack-gate
    if: needs.stack-gate.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-e2e
        with:
          cluster-name: pgroles-e2e-load

      - name: Run load tests
        run: |
          source scripts/e2e-helpers.sh

          bash scripts/generate-load-policy.sh 20 /tmp/load-policy.yaml load-policy postgres-credentials loada
          bash scripts/generate-load-policy.sh 10 /tmp/load-policy-secondary.yaml load-policy-secondary loadtest-postgres-credentials loadb
          {
            echo "BEGIN;"
            for i in $(seq -w 1 20); do
              echo "CREATE SCHEMA IF NOT EXISTS loada_${i};"
              echo "CREATE TABLE IF NOT EXISTS loada_${i}.items (id integer generated always as identity primary key, name text not null);"
              echo "CREATE SEQUENCE IF NOT EXISTS loada_${i}.audit_seq;"
            done
            echo "COMMIT;"
          } | kubectl exec -i postgres-0 -- psql -v ON_ERROR_STOP=1 -U postgres -d postgres

          {
            echo "BEGIN;"
            for i in $(seq -w 1 10); do
              echo "CREATE SCHEMA IF NOT EXISTS loadb_${i};"
              echo "CREATE TABLE IF NOT EXISTS loadb_${i}.items (id integer generated always as identity primary key, name text not null);"
              echo "CREATE SEQUENCE IF NOT EXISTS loadb_${i}.audit_seq;"
            done
            echo "COMMIT;"
          } | kubectl exec -i postgres-0 -- psql -v ON_ERROR_STOP=1 -U postgres -d loadtest

          load_start="$(date +%s)"
          kubectl apply -f /tmp/load-policy.yaml
          kubectl apply -f /tmp/load-policy-secondary.yaml
          wait_for_ready_true load-policy 60 5
          wait_for_ready_true load-policy-secondary 60 5
          load_elapsed="$(( $(date +%s) - load_start ))"
          printf 'Generated load policies reconciled in %ss across %s databases, %s schemas, and %s generated roles\n' \
            "$load_elapsed" "2" "$((20 + 10))" "$(((20 + 10) * 2))" >> "$GITHUB_STEP_SUMMARY"

          test "$(pg_query "SELECT count(*) FROM pg_roles WHERE rolname ~ '^loada_[0-9]{2}-(editor|viewer)$'")" = "40"
          test "$(pg_query "SELECT count(*) FROM pg_roles WHERE rolname ~ '^loadb_[0-9]{2}-(editor|viewer)$'")" = "20"

          pg_query "SELECT has_schema_privilege('loada_01-editor', 'loada_01', 'USAGE')" | grep -qx "t"
          pg_query "SELECT has_table_privilege('loada_20-viewer', 'loada_20.items', 'SELECT')" | grep -qx "t"
          pg_query "SELECT has_sequence_privilege('loada_10-editor', 'loada_10.audit_seq', 'USAGE')" | grep -qx "t"
          pg_query "SELECT has_schema_privilege('loadb_01-editor', 'loadb_01', 'USAGE')" loadtest | grep -qx "t"
          pg_query "SELECT has_table_privilege('loadb_10-viewer', 'loadb_10.items', 'SELECT')" loadtest | grep -qx "t"
          pg_query "SELECT has_sequence_privilege('loadb_05-editor', 'loadb_05.audit_seq', 'USAGE')" loadtest | grep -qx "t"

          # Every assertion above is about convergence, which says nothing
          # about what the operator paid to get there. An operator that was
          # OOM-killed part way through and came back still converges these
          # policies eventually, so only a restart check sees it.
          assert_operator_healthy

      - name: Run ephemeral request cache regression
        run: scripts/e2e-ephemeral-request-load.sh

      # Again, because the step above is where 250 requests are pushed through
      # the operator and is the likelier place for it to die. Its own peak and
      # throughput budgets are satisfiable by an operator that was killed and
      # recovered quickly, and the check after the load policies covers only
      # what ran before it. Two calls also say which scenario did it.
      - name: Assert the operator survived the whole job
        run: |
          source scripts/e2e-helpers.sh
          assert_operator_healthy

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pgr,pgplan,pgcand,pgeap,pgear -A -o wide || true
          kubectl get pgr,pgplan,pgcand -A -o yaml | head -c 200000 || true
          kubectl -n pgroles-system logs deployment/pgroles-operator --tail=2000 || true
          kubectl -n pgroles-system logs deployment/pgroles-operator --previous --tail=2000 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true

      - name: Cleanup
        if: always()
        run: kind delete cluster --name pgroles-e2e-load

  # ---------------------------------------------------------------------------
  # Job 5c: E2E — Plan Lifecycle
  # ---------------------------------------------------------------------------
  e2e-plans:
    name: "E2E: Plan Lifecycle"
    needs: stack-gate
    if: needs.stack-gate.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-e2e
        with:
          cluster-name: pgroles-e2e-plans
          operator-features: e2e-fault-injection

      # The candidate scenarios below drive the `pgroles` CLI against this live
      # cluster, so the binary has to exist on the runner. Built from the
      # Dockerfile's existing `cli` target rather than with a second cargo
      # toolchain: `setup-e2e` has just built the operator image, so the shared
      # `base` stage and the cargo registry/target cache mounts are warm and
      # only the CLI crate itself is compiled.
      - name: Build the pgroles CLI
        run: |
          docker build -f docker/Dockerfile --target cli -t pgroles-cli:e2e .
          container="$(docker create pgroles-cli:e2e)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/usr/local/bin/pgroles" /usr/local/bin/pgroles
          pgroles --version

      - name: Recover from a Secret-first process crash
        run: scripts/e2e-secret-first-crash.sh

      - name: Recover from a computed plan name collision
        run: scripts/e2e-plan-name-collision.sh

      - name: Run plan lifecycle scenarios
        run: |
          source scripts/e2e-helpers.sh

          # ================================================================
          # Group A: Manual approval flow
          # ================================================================

          echo "--- Test: Plan creation on drift detection ---"
          kubectl apply -f k8s/samples/plan-approval-policy.yaml
          wait_for_ready_status_reason plan-approval-policy True Planned
          wait_for_drift_status plan-approval-policy True

          # Verify plan was created
          plan_count=$(get_plan_count plan-approval-policy)
          if [ "$plan_count" -lt 1 ]; then
            echo "::error::Expected at least 1 plan for plan-approval-policy, got $plan_count"
            exit 1
          fi

          # Get the plan name
          plan_name=$(wait_for_current_plan_ref plan-approval-policy)

          # Verify plan fields
          phase=$(kubectl get pgplan "$plan_name" -o jsonpath='{.status.phase}')
          test "$phase" = "Pending" || { echo "::error::Expected Pending phase, got $phase"; exit 1; }

          total=$(kubectl get pgplan "$plan_name" -o jsonpath='{.status.changeSummary.total}')
          test "$total" -gt 0 || { echo "::error::Expected changes > 0, got $total"; exit 1; }

          hash=$(kubectl get pgplan "$plan_name" -o jsonpath='{.status.sqlHash}')
          test -n "$hash" || { echo "::error::Expected sqlHash to be set"; exit 1; }

          echo "--- Test: Printer columns display ---"
          kubectl get pgplan
          # Just verify command succeeds and shows our plan

          echo "--- Test: Manual approval -> Applied ---"
          approve_plan "$plan_name"
          wait_for_plan_phase "$plan_name" Applied

          assert_role_exists approval_test_user

          applied_at=$(kubectl get pgplan "$plan_name" -o jsonpath='{.status.appliedAt}')
          test -n "$applied_at" || { echo "::error::Expected appliedAt to be set"; exit 1; }

          # Verify events
          wait_for_event_reason plan-approval-policy PlanApproved
          wait_for_event_reason plan-approval-policy ApplySucceeded

          # Cleanup
          kubectl delete pgr plan-approval-policy --wait=true
          pg_query "REASSIGN OWNED BY approval_test_user TO postgres; DROP OWNED BY approval_test_user; DROP ROLE IF EXISTS approval_test_user;"

          # ================================================================
          # Group A continued: target identity (#180)
          # ================================================================

          echo "--- Test: repointing the connection Secret supersedes the plan ---"
          # One Postgres runs in this cluster, so the *physical* identity
          # (system_identifier) is the same either way. Pointing the Secret at
          # a different database on it changes the logical fingerprint — which
          # is exactly the repointing case a Kubernetes reference cannot see,
          # since `secretRef` names the same Secret and key throughout.
          pg_query "SELECT 1 FROM pg_database WHERE datname='identity_alt'" | grep -qx 1 \
            || pg_query "CREATE DATABASE identity_alt"

          upsert_secret target-identity-credentials \
            DATABASE_URL='postgres://postgres:devpassword@postgres.default.svc.cluster.local:5432/postgres'

          kubectl apply -f - <<EOF
          apiVersion: pgroles.io/v1alpha1
          kind: PostgresPolicy
          metadata:
            name: target-identity-policy
            namespace: default
          spec:
            connection:
              secretRef:
                name: target-identity-credentials
            interval: "30s"
            mode: apply
            approval: manual
            roles:
              - name: target_identity_user
                login: true
          EOF

          wait_for_ready_status_reason target-identity-policy True Planned
          first_plan=$(wait_for_current_plan_ref target-identity-policy)

          # Both identities are recorded. A real PostgreSQL always exposes
          # pg_control_system(), so the physical half must be present here.
          physical=$(kubectl get pgplan "$first_plan" -o jsonpath='{.status.targetPhysicalIdentity}')
          logical=$(kubectl get pgplan "$first_plan" -o jsonpath='{.status.targetLogicalFingerprint}')
          available=$(kubectl get pgplan "$first_plan" -o jsonpath='{.status.physicalIdentityAvailable}')
          test -n "$physical" || { echo "::error::Expected targetPhysicalIdentity to be set"; exit 1; }
          test -n "$logical" || { echo "::error::Expected targetLogicalFingerprint to be set"; exit 1; }
          test "$available" = "true" || { echo "::error::Expected physicalIdentityAvailable=true, got $available"; exit 1; }

          # Repoint at a different database. The plan was computed against the
          # old target, so it can no longer authorise anything.
          upsert_secret target-identity-credentials \
            DATABASE_URL='postgres://postgres:devpassword@postgres.default.svc.cluster.local:5432/identity_alt'

          wait_for_plan_phase "$first_plan" Superseded
          second_plan=$(wait_for_current_plan_ref target-identity-policy)
          test "$second_plan" != "$first_plan" || { echo "::error::Expected a fresh plan after repointing"; exit 1; }

          moved_logical=$(kubectl get pgplan "$second_plan" -o jsonpath='{.status.targetLogicalFingerprint}')
          test "$moved_logical" != "$logical" || { echo "::error::Logical fingerprint did not change after repointing"; exit 1; }
          moved_physical=$(kubectl get pgplan "$second_plan" -o jsonpath='{.status.targetPhysicalIdentity}')
          test "$moved_physical" = "$physical" || { echo "::error::Physical identity changed on the same cluster"; exit 1; }

          # The approval never carried over: nothing ran against either database.
          assert_role_absent target_identity_user

          kubectl delete pgr target-identity-policy --wait=true
          # The operator may still hold a pooled connection to it briefly.
          pg_query "DROP DATABASE IF EXISTS identity_alt WITH (FORCE)" || true

          # ================================================================
          # Group A continued: Rejection
          # ================================================================

          echo "--- Test: Plan rejection ---"
          # Create a new policy that will generate drift
          kubectl apply -f - <<EOF
          apiVersion: pgroles.io/v1alpha1
          kind: PostgresPolicy
          metadata:
            name: reject-test-policy
            namespace: default
          spec:
            connection:
              secretRef:
                name: postgres-credentials
            interval: "30s"
            mode: apply
            approval: manual
            roles:
              - name: reject_test_user
                login: true
            grants:
              - role: reject_test_user
                privileges: [CONNECT]
                object:
                  type: database
                  name: postgres
          EOF

          wait_for_ready_status_reason reject-test-policy True Planned
          plan_name=$(wait_for_current_plan_ref reject-test-policy)

          reject_plan "$plan_name"
          wait_for_plan_phase "$plan_name" Rejected

          # Verify role was NOT created
          if pg_query "SELECT 1 FROM pg_roles WHERE rolname='reject_test_user'" | grep -q 1; then
            echo "::error::reject_test_user should NOT exist after rejection"
            exit 1
          fi

          # Cleanup
          kubectl delete pgr reject-test-policy --wait=true

          # ================================================================
          # Group B: Auto-approval
          # ================================================================

          echo "--- Test: Auto-approval mode ---"
          kubectl apply -f k8s/samples/auto-approval-policy.yaml
          wait_for_ready_true auto-approval-policy

          # In auto mode, plan should be created AND applied automatically
          assert_role_exists auto_approved_user

          # Verify a plan exists and is Applied
          plan_count=$(get_plan_count auto-approval-policy)
          test "$plan_count" -ge 1 || { echo "::error::Expected at least 1 plan"; exit 1; }

          # The latest plan should be Applied
          latest_plan=$(kubectl get pgplan -l pgroles.io/policy=auto-approval-policy --sort-by=.metadata.creationTimestamp -o name | tail -1)
          phase=$(kubectl get "$latest_plan" -o jsonpath='{.status.phase}')
          test "$phase" = "Applied" || { echo "::error::Expected Applied phase for auto-approval, got $phase"; exit 1; }

          # Cleanup
          kubectl delete pgr auto-approval-policy --wait=true
          pg_query "REASSIGN OWNED BY auto_approved_user TO postgres; DROP OWNED BY auto_approved_user; DROP ROLE IF EXISTS auto_approved_user;"

          # ================================================================
          # Group B2: passwords under manual approval (#181, #174)
          # ================================================================

          echo "--- Test: generated Secret is not created before approval ---"
          upsert_secret manual-approval-passwords manual_ref_user='e2e_manual_pw!'
          cat >/tmp/deferred-password-policy.yaml <<'EOF'
          apiVersion: pgroles.io/v1alpha1
          kind: PostgresPolicy
          metadata:
            name: deferred-password-policy
            namespace: default
          spec:
            connection:
              secretRef:
                name: postgres-credentials
            interval: "15s"
            mode: apply
            approval: manual
            roles:
              - name: deferred_gen_user
                login: true
                password:
                  generate:
                    length: 32
                    secretName: deferred-gen-secret
              - name: manual_ref_user
                login: true
                password:
                  secretRef:
                    name: manual-approval-passwords
                  secretKey: manual_ref_user
          EOF
          kubectl apply -f /tmp/deferred-password-policy.yaml

          wait_for_ready_status_reason deferred-password-policy True Planned
          first_plan=$(wait_for_current_plan_ref deferred-password-policy)

          # The credential must not exist while the plan is only proposed.
          assert_secret_absent deferred-gen-secret
          assert_secret_absent_stable deferred-gen-secret

          echo "--- Test: rejection leaves no generated Secret behind ---"
          reject_plan "$first_plan"
          wait_for_plan_phase "$first_plan" Rejected
          assert_secret_absent deferred-gen-secret
          assert_role_absent deferred_gen_user

          echo "--- Test: approval materializes the Secret exactly once ---"
          # Rejection deliberately does not create a replacement in the same
          # cycle, so wait for the next reconcile's plan rather than reusing the
          # rejected one.
          for i in $(seq 1 30); do
            second_plan=$(kubectl get pgr deferred-password-policy \
              -o jsonpath='{.status.current_plan_ref.name}' 2>/dev/null || true)
            if [ -n "$second_plan" ] && [ "$second_plan" != "$first_plan" ]; then
              break
            fi
            echo "Waiting for a replacement plan... ($i/30)"
            sleep 3
          done
          test -n "$second_plan" && test "$second_plan" != "$first_plan" \
            || { echo "::error::no replacement plan after rejection"; exit 1; }

          assert_secret_absent deferred-gen-secret
          approve_plan "$second_plan"
          wait_for_plan_phase "$second_plan" Applied

          assert_role_exists deferred_gen_user
          assert_password_set deferred_gen_user
          assert_role_exists manual_ref_user
          assert_password_set manual_ref_user
          assert_secret_has_keys deferred-gen-secret password verifier

          gen_secret_count=$(kubectl get secret \
            -l pgroles.io/policy=deferred-password-policy --no-headers 2>/dev/null | wc -l | tr -d ' ')
          test "$gen_secret_count" -eq 1 \
            || { echo "::error::expected exactly 1 generated Secret, got $gen_secret_count"; exit 1; }

          # The regression #181's fix exists for: if the policy recorded the
          # planning-time `:missing` sentinel instead of the version the created
          # Secret reported, this next reconcile would plan another password
          # change and demand a second approval.
          wait_for_drift_status deferred-password-policy False
          assert_no_pending_plan_stable deferred-password-policy
          gen_password_hash="$(get_password_hash deferred_gen_user)"
          wait_for_password_hash_stable deferred_gen_user "$gen_password_hash"

          kubectl delete pgr deferred-password-policy --wait=true
          pg_query "DROP ROLE IF EXISTS deferred_gen_user; DROP ROLE IF EXISTS manual_ref_user;"

          # ================================================================
          # Group C: Plan supersede on policy change
          # ================================================================

          echo "--- Test: Plan supersede on policy change ---"
          kubectl apply -f - <<EOF
          apiVersion: pgroles.io/v1alpha1
          kind: PostgresPolicy
          metadata:
            name: supersede-test
            namespace: default
          spec:
            connection:
              secretRef:
                name: postgres-credentials
            interval: "30s"
            mode: observe
            approval: manual
            roles:
              - name: supersede_user_v1
                login: true
          EOF

          wait_for_ready_status_reason supersede-test True Planned
          first_plan=$(wait_for_current_plan_ref supersede-test)
          echo "First plan: $first_plan"

          # Update policy - add another role
          kubectl apply -f - <<EOF
          apiVersion: pgroles.io/v1alpha1
          kind: PostgresPolicy
          metadata:
            name: supersede-test
            namespace: default
          spec:
            connection:
              secretRef:
                name: postgres-credentials
            interval: "30s"
            mode: observe
            approval: manual
            roles:
              - name: supersede_user_v1
                login: true
              - name: supersede_user_v2
                login: true
          EOF

          # Wait for currentPlanRef to change (not just exist)
          second_plan=""
          for i in $(seq 1 30); do
            second_plan="$(kubectl get pgr supersede-test -o jsonpath='{.status.current_plan_ref.name}' 2>/dev/null || true)"
            if [ -n "$second_plan" ] && [ "$second_plan" != "$first_plan" ]; then
              break
            fi
            echo "Waiting for supersede-test currentPlanRef to change... ($i/30)"
            sleep 3
          done
          echo "Second plan: $second_plan"

          if [ -z "$second_plan" ] || [ "$first_plan" = "$second_plan" ]; then
            echo "::error::Expected a new plan after policy change"
            exit 1
          fi

          # Verify first plan is Superseded
          first_phase=$(kubectl get pgplan "$first_plan" -o jsonpath='{.status.phase}')
          test "$first_phase" = "Superseded" || { echo "::error::Expected first plan to be Superseded, got $first_phase"; exit 1; }

          # Verify second plan is Pending
          second_phase=$(kubectl get pgplan "$second_plan" -o jsonpath='{.status.phase}')
          test "$second_phase" = "Pending" || { echo "::error::Expected second plan to be Pending, got $second_phase"; exit 1; }

          # Cleanup
          kubectl delete pgr supersede-test --wait=true

          # ================================================================
          # Group D: Finalizer cleanup on policy delete
          # ================================================================

          echo "--- Test: Finalizer cleanup on policy delete ---"
          kubectl apply -f - <<EOF
          apiVersion: pgroles.io/v1alpha1
          kind: PostgresPolicy
          metadata:
            name: cleanup-test
            namespace: default
          spec:
            connection:
              secretRef:
                name: postgres-credentials
            interval: "30s"
            mode: observe
            approval: manual
            roles:
              - name: cleanup_test_user
                login: true
          EOF

          wait_for_ready_status_reason cleanup-test True Planned
          plan_name=$(wait_for_current_plan_ref cleanup-test)

          # Delete the policy - plans should be GC'd via ownerReferences
          kubectl delete pgr cleanup-test --wait=true

          # Wait for GC to clean up the plan (async via ownerReferences)
          kubectl wait --for=delete "pgplan/${plan_name}" --timeout=30s || {
            echo "::error::Plan $plan_name should have been garbage collected"
            exit 1
          }
          echo "Plan garbage collected after policy deletion"

          # ================================================================
          # Group E: Error handling
          # ================================================================

          echo "--- Test: Invalid manifest does not create plan ---"
          kubectl apply -f k8s/samples/invalid-policy.yaml 2>/dev/null || true
          sleep 5
          plan_count=$(get_plan_count invalid-policy)
          test "$plan_count" -eq 0 || { echo "::error::Invalid policy should not create plans, got $plan_count"; exit 1; }
          echo "No plan created for invalid policy"
          kubectl delete pgr invalid-policy --wait=true 2>/dev/null || true

          # ================================================================
          # Group F: Multi-policy independent plans
          # ================================================================

          echo "--- Test: Multi-policy independent plans ---"
          # Create schemas first
          pg_query "CREATE SCHEMA IF NOT EXISTS schema_alpha;"
          pg_query "CREATE SCHEMA IF NOT EXISTS schema_beta;"

          kubectl apply -f k8s/samples/multi-schema-policy-a.yaml
          kubectl apply -f k8s/samples/multi-schema-policy-b.yaml

          wait_for_ready_status_reason multi-schema-a True Planned
          wait_for_ready_status_reason multi-schema-b True Planned

          plan_a=$(wait_for_current_plan_ref multi-schema-a)
          plan_b=$(wait_for_current_plan_ref multi-schema-b)

          test "$plan_a" != "$plan_b" || { echo "::error::Expected different plans for different policies"; exit 1; }
          echo "Independent plans created for multi-policy setup"

          # Cleanup
          kubectl delete pgr multi-schema-a multi-schema-b --wait=true
          pg_query "DROP SCHEMA IF EXISTS schema_alpha CASCADE; DROP SCHEMA IF EXISTS schema_beta CASCADE;"

          # ================================================================
          # Group G: UID isolation for colliding policy labels
          # ================================================================

          echo "--- Test: Colliding policy labels stay UID-isolated ---"
          collision_prefix="zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz"
          collision_a="${collision_prefix}.one"
          collision_b="${collision_prefix}.two"

          # Both names are valid DNS subdomains, but LabelValue::sanitize
          # truncates both to the same 63-byte server-side prefilter.
          test "${#collision_prefix}" -eq 63
          kubectl apply -f - <<EOF
          apiVersion: pgroles.io/v1alpha1
          kind: PostgresPolicy
          metadata:
            name: ${collision_a}
            namespace: default
          spec:
            connection:
              secretRef:
                name: postgres-credentials
            interval: "30s"
            mode: apply
            approval: manual
            roles:
              - name: collision_uid_user_one
                login: true
          ---
          apiVersion: pgroles.io/v1alpha1
          kind: PostgresPolicy
          metadata:
            name: ${collision_b}
            namespace: default
          spec:
            connection:
              secretRef:
                name: postgres-credentials
            interval: "30s"
            mode: apply
            approval: manual
            roles:
              - name: collision_uid_user_two
                login: true
          EOF

          wait_for_ready_status_reason "$collision_a" True Planned
          plan_a=$(wait_for_current_plan_ref "$collision_a")
          wait_for_ready_status_reason "$collision_b" True Planned
          plan_b=$(wait_for_current_plan_ref "$collision_b")
          test "$plan_a" != "$plan_b" \
            || { echo "::error::colliding policies selected the same plan"; exit 1; }

          label_a="$(kubectl get pgplan "$plan_a" -o jsonpath='{.metadata.labels.pgroles\.io/policy}')"
          label_b="$(kubectl get pgplan "$plan_b" -o jsonpath='{.metadata.labels.pgroles\.io/policy}')"
          test "$label_a" = "$label_b" \
            || { echo "::error::fixture does not produce a policy-label collision"; exit 1; }

          uid_a="$(kubectl get pgr "$collision_a" -o jsonpath='{.metadata.uid}')"
          uid_b="$(kubectl get pgr "$collision_b" -o jsonpath='{.metadata.uid}')"
          owner_a="$(kubectl get pgplan "$plan_a" -o jsonpath='{.metadata.ownerReferences[?(@.controller==true)].uid}')"
          owner_b="$(kubectl get pgplan "$plan_b" -o jsonpath='{.metadata.ownerReferences[?(@.controller==true)].uid}')"
          # An unmatched jsonpath yields an empty string, and "" = "" would pass
          # the comparison below while proving nothing. Demand real UIDs first.
          for uid in "$uid_a" "$uid_b" "$owner_a" "$owner_b"; do
            [ -n "$uid" ] \
              || { echo "::error::missing policy or plan owner UID in collision scenario"; exit 1; }
          done
          test "$owner_a" = "$uid_a" && test "$owner_b" = "$uid_b" \
            || { echo "::error::plans are not separated by policy owner UID"; exit 1; }

          # B is the newer pending plan and shares A's label. Approving A proves
          # A's actionable-plan lookup does not accidentally select B.
          approve_plan "$plan_a"
          wait_for_plan_phase "$plan_a" Applied
          assert_role_exists collision_uid_user_one
          test "$(kubectl get pgplan "$plan_b" -o jsonpath='{.status.phase}')" = "Pending" \
            || { echo "::error::approving A mutated B's plan"; exit 1; }
          assert_role_absent collision_uid_user_two

          # Owner-reference cleanup must remove only A's plan despite the label
          # collision. B must remain independently discoverable and actionable.
          kubectl delete pgr "$collision_a" --wait=true
          kubectl wait --for=delete "pgplan/${plan_a}" --timeout=30s || {
            echo "::error::plan $plan_a should have been garbage collected"
            exit 1
          }
          test "$(kubectl get pgr "$collision_b" -o jsonpath='{.status.current_plan_ref.name}')" = "$plan_b" \
            || { echo "::error::deleting A disturbed B's current plan lookup"; exit 1; }
          test "$(kubectl get pgplan "$plan_b" -o jsonpath='{.status.phase}')" = "Pending" \
            || { echo "::error::deleting A removed or changed B's plan"; exit 1; }

          approve_plan "$plan_b"
          wait_for_plan_phase "$plan_b" Applied
          assert_role_exists collision_uid_user_two

          kubectl delete pgr "$collision_b" --wait=true
          pg_query "DROP ROLE IF EXISTS collision_uid_user_one; DROP ROLE IF EXISTS collision_uid_user_two;"

          # ================================================================
          # Group H: Operator restart with pending plan
          # ================================================================

          echo "--- Test: Operator restart with pending plan ---"
          kubectl apply -f - <<EOF
          apiVersion: pgroles.io/v1alpha1
          kind: PostgresPolicy
          metadata:
            name: restart-test
            namespace: default
          spec:
            connection:
              secretRef:
                name: postgres-credentials
            interval: "30s"
            mode: apply
            approval: manual
            roles:
              - name: restart_test_user
                login: true
          EOF

          wait_for_ready_status_reason restart-test True Planned
          plan_name=$(wait_for_current_plan_ref restart-test)

          # Restart the operator
          kubectl -n pgroles-system rollout restart deployment/pgroles-operator
          kubectl -n pgroles-system rollout status deployment/pgroles-operator --timeout=60s

          # Plan should still exist and be Pending
          sleep 10
          phase=$(kubectl get pgplan "$plan_name" -o jsonpath='{.status.phase}')
          test "$phase" = "Pending" || { echo "::error::Expected plan to remain Pending after restart, got $phase"; exit 1; }

          # Approve it - should still work after restart
          approve_plan "$plan_name"
          wait_for_plan_phase "$plan_name" Applied
          assert_role_exists restart_test_user

          echo "Operator restart handled correctly"

          # Cleanup
          kubectl delete pgr restart-test --wait=true
          pg_query "REASSIGN OWNED BY restart_test_user TO postgres; DROP OWNED BY restart_test_user; DROP ROLE IF EXISTS restart_test_user;"

      # ==================================================================
      # Group F: candidates and promotion (#182)
      #
      # Extends this job rather than adding one: these scenarios need the same
      # cluster, operator and PostgreSQL, and a second kind cluster would cost
      # several minutes of CI for nothing.
      # ==================================================================
      - name: Verify candidate grant preservation
        run: scripts/e2e-candidate-preservation.sh

      - name: Run candidate and promotion scenarios
        run: |
          source scripts/e2e-helpers.sh

          # Write the policy with the base role plus every role named in "$@",
          # and apply it. This is the GitOps promotion: the same content the
          # candidate carried, written into PostgresPolicy.spec.
          write_promo_policy() {
            cat >/tmp/promo-policy.yaml <<'POLICY'
          apiVersion: pgroles.io/v1alpha1
          kind: PostgresPolicy
          metadata:
            name: promo-policy
            namespace: default
          spec:
            connection:
              secretRef:
                name: postgres-credentials
            interval: "15s"
            mode: apply
            approval: manual
            roles:
              - name: promo_base_user
                login: true
          POLICY
            local role
            for role in "$@"; do
              printf '    - name: %s\n      login: true\n' "$role" >>/tmp/promo-policy.yaml
            done
            kubectl apply -f /tmp/promo-policy.yaml
          }

          # A candidate proposing the base role plus every role named in "$2..".
          file_candidate() {
            local name="$1"; shift
            {
              printf 'apiVersion: pgroles.io/v1alpha1\n'
              printf 'kind: PostgresPolicyCandidate\n'
              printf 'metadata:\n  name: %s\n  namespace: default\n' "$name"
              printf 'spec:\n  policyRef:\n    name: promo-policy\n'
              printf '  content:\n    roles:\n      - name: promo_base_user\n        login: true\n'
              local role
              for role in "$@"; do
                printf '      - name: %s\n        login: true\n' "$role"
              done
            } >"/tmp/$name.yaml"
            kubectl apply -f "/tmp/$name.yaml"
          }

          echo "--- Test: base policy converges before any candidate exists ---"
          write_promo_policy
          base_plan=$(wait_for_pending_plan_ref promo-policy)
          approve_plan "$base_plan"
          wait_for_plan_phase "$base_plan" Applied
          assert_role_exists promo_base_user

          echo "--- Test: the open-candidate budget queues the excess and plans the rest (#191) ---"
          # The unit tests pin the classification itself; what only a live
          # cluster shows is the wiring — that an over-budget candidate is
          # reported rather than silently dropped, that it is NOT deleted, and
          # that being over budget does not stop its elders from planning.
          #
          # The TTL half deliberately has no E2E: it is fourteen days long, and
          # a knob to shorten it would exist only for the test. Its
          # classification is unit-tested and it shares mark_superseded with the
          # scenarios above.
          budget=32
          kubectl delete pgcand --all --wait=true

          # One over the budget, oldest first. Created in order so the API
          # server's creationTimestamps rank them the way the operator sorts.
          for i in $(seq 0 "$budget"); do
            file_candidate "$(printf 'budget-%03d' "$i")" "$(printf 'budget_user_%03d' "$i")"
          done

          # The newest is the one over budget: the oldest keep their slots, so a
          # flood of new proposals cannot evict what is already under review.
          newest="$(printf 'budget-%03d' "$budget")"
          wait_for_candidate_condition "$newest" Ready False CandidateBudgetExceeded

          # It is queued, not discarded — the object is still there, still not
          # terminal, and carries no plan.
          kubectl get pgcand "$newest" >/dev/null \
            || { echo "::error::an over-budget candidate was deleted"; exit 1; }
          over_phase="$(kubectl get pgcand "$newest" -o jsonpath='{.status.phase}')"
          case "$over_phase" in
            Promoted|Superseded)
              echo "::error::an over-budget candidate went terminal (phase=$over_phase)"
              exit 1
              ;;
          esac
          over_plan="$(kubectl get pgcand "$newest" -o jsonpath='{.status.planRef.name}' 2>/dev/null || true)"
          test -z "$over_plan" \
            || { echo "::error::an over-budget candidate was planned anyway ($over_plan)"; exit 1; }

          # And the budget did not cost the others their planning.
          wait_for_candidate_condition budget-000 Ready True Planned
          wait_for_candidate_condition "$(printf 'budget-%03d' "$((budget - 1))")" Ready True Planned

          # Freeing a slot lets the queued candidate through, which is what
          # makes CandidateBudgetExceeded a queue rather than a rejection.
          kubectl delete pgcand budget-000 --wait=true
          wait_for_candidate_condition "$newest" Ready True Planned

          # No role cleanup needed: candidate planning never executes SQL, so
          # none of budget_user_* was ever created.
          kubectl delete pgcand --all --wait=true

          echo "--- Test: a candidate is planned and writes nothing ---"
          file_candidate promo-cand-1 promo_new_user
          wait_for_candidate_phase promo-cand-1 Planned
          wait_for_candidate_condition promo-cand-1 Ready True Planned
          cand_plan=$(wait_for_candidate_plan_ref promo-cand-1)

          # The plan binds the content digest promotion is matched against, and
          # the candidate that produced it.
          cand_digest=$(get_candidate_digest promo-cand-1)
          test -n "$cand_digest" || { echo "::error::candidate has no contentDigest"; exit 1; }
          plan_digest=$(kubectl get pgplan "$cand_plan" -o jsonpath='{.spec.origin.contentDigest}')
          test "$plan_digest" = "$cand_digest" \
            || { echo "::error::plan contentDigest '$plan_digest' != candidate '$cand_digest'"; exit 1; }
          origin_kind=$(kubectl get pgplan "$cand_plan" -o jsonpath='{.spec.origin.kind}')
          test "$origin_kind" = "PostgresPolicyCandidate" \
            || { echo "::error::expected a candidate-origin plan, got '$origin_kind'"; exit 1; }

          # The active policy keeps enforcing, and the proposal executes nothing.
          assert_role_exists promo_base_user
          assert_role_absent promo_new_user

          echo "--- Test: the candidate spec is immutable (CEL) ---"
          if kubectl patch pgcand promo-cand-1 --type=merge \
              -p '{"spec":{"content":{"roles":[{"name":"promo_sneaky_user","login":true}]}}}' \
              2>/tmp/immutable.txt; then
            echo "::error::editing a candidate spec was accepted; immutability is not in force"
            exit 1
          fi
          cat /tmp/immutable.txt
          grep -qi 'immutable' /tmp/immutable.txt \
            || { echo "::error::the rejection did not name immutability"; exit 1; }
          assert_role_absent promo_sneaky_user

          echo "--- Test: approving a candidate plan executes nothing by itself ---"
          # Prove the negative against a completed reconcile rather than a
          # fixed sleep: capture the policy's last successful reconcile time,
          # approve, and wait for it to move past the baseline — at that point
          # the operator has reconciled with the approval visible, so the role
          # staying absent is meaningful.
          reconcile_baseline=$(kubectl get pgr promo-policy \
            -o jsonpath='{.status.last_successful_reconcile_time}')
          approve_plan "$cand_plan"
          for i in $(seq 1 20); do
            reconcile_now=$(kubectl get pgr promo-policy \
              -o jsonpath='{.status.last_successful_reconcile_time}' 2>/dev/null || true)
            if [ -n "$reconcile_now" ] && [ "$reconcile_now" != "$reconcile_baseline" ]; then
              echo "promo-policy reconciled after the approval ($reconcile_baseline -> $reconcile_now)"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "::error::promo-policy did not reconcile within 60s of approving the candidate plan"
              exit 1
            fi
            echo "Waiting for promo-policy to reconcile after the approval... ($i/20)"
            sleep 3
          done
          assert_role_absent promo_new_user

          echo "--- Test: promoting the approved content executes it ---"
          write_promo_policy promo_new_user
          wait_for_plan_phase "$cand_plan" Applied
          assert_role_exists promo_new_user
          wait_for_candidate_phase promo-cand-1 Promoted
          wait_for_candidate_condition promo-cand-1 Promoted True Promoted

          # The policy records the content it converged on — the same digest,
          # computed over the same canonical form, on both kinds.
          policy_digest=$(get_policy_content_digest promo-policy)
          test "$policy_digest" = "$cand_digest" \
            || { echo "::error::policy digest '$policy_digest' != promoted candidate '$cand_digest'"; exit 1; }

          echo "--- Test: promoting EDITED content falls back to the manual flow ---"
          file_candidate promo-cand-2 promo_new_user promo_edited_user
          wait_for_candidate_phase promo-cand-2 Planned
          cand2_plan=$(wait_for_candidate_plan_ref promo-cand-2)
          approve_plan "$cand2_plan"

          # Merge something that is not what was approved.
          write_promo_policy promo_new_user promo_other_user

          wait_for_candidate_condition promo-cand-2 Promoted False PromotionDigestMismatch
          # Nothing executed on an approval that does not cover this content —
          # neither the approved candidate's role nor the merged one.
          assert_role_absent promo_edited_user
          assert_role_absent promo_other_user

          # The merged content goes through the ordinary manual-plan flow.
          fresh_plan=$(wait_for_pending_plan_ref promo-policy)
          test "$fresh_plan" != "$cand2_plan" \
            || { echo "::error::the policy adopted a candidate plan for content it does not describe"; exit 1; }
          approve_plan "$fresh_plan"
          wait_for_plan_phase "$fresh_plan" Applied
          assert_role_exists promo_other_user

          # The edited promotion never promoted the approved candidate.
          phase=$(kubectl get pgcand promo-cand-2 -o jsonpath='{.status.phase}')
          test "$phase" != "Promoted" \
            || { echo "::error::a candidate whose content never applied reached Promoted"; exit 1; }

          echo "--- Test: approving X and merging Y promotes Y and strands X ---"
          file_candidate promo-cand-x promo_new_user promo_other_user promo_x_user
          file_candidate promo-cand-y promo_new_user promo_other_user promo_y_user
          wait_for_candidate_phase promo-cand-x Planned
          wait_for_candidate_phase promo-cand-y Planned
          plan_x=$(wait_for_candidate_plan_ref promo-cand-x)
          plan_y=$(wait_for_candidate_plan_ref promo-cand-y)
          approve_plan "$plan_x"
          approve_plan "$plan_y"

          write_promo_policy promo_new_user promo_other_user promo_y_user

          wait_for_plan_phase "$plan_y" Applied
          wait_for_candidate_phase promo-cand-y Promoted
          assert_role_exists promo_y_user
          # X was approved against a base this promotion replaced: its approval
          # is retired rather than left executable, and nothing of X ran.
          wait_for_plan_phase "$plan_x" Superseded
          reason=$(kubectl get pgplan "$plan_x" \
            -o jsonpath='{.status.conditions[?(@.type=="Superseded")].reason}')
          test "$reason" = "SupersededByPromotion" \
            || { echo "::error::expected SupersededByPromotion on the stranded plan, got '$reason'"; exit 1; }
          # The decision record itself is untouched: who approved what is
          # write-once, and retiring a plan must not rewrite it.
          decided=$(kubectl get pgplan "$plan_x" -o jsonpath='{.status.decidedBy.username}')
          test "$decided" = "e2e-reviewer" \
            || { echo "::error::stranding a plan rewrote its decision identity: '$decided'"; exit 1; }
          assert_role_absent promo_x_user

          echo "--- Test: identical candidates — the approved plan picks the promoted one ---"
          # dup-cand-a is created FIRST, so lexicographic and creation order
          # both point at it; only dup-cand-b's plan carries the approval, so
          # b — not a — must be the candidate recorded Promoted.
          file_candidate dup-cand-a promo_new_user promo_other_user promo_y_user dup_promo_user
          wait_for_candidate_phase dup-cand-a Planned
          file_candidate dup-cand-b promo_new_user promo_other_user promo_y_user dup_promo_user
          wait_for_candidate_phase dup-cand-b Planned
          dup_plan_a=$(wait_for_candidate_plan_ref dup-cand-a)
          dup_plan_b=$(wait_for_candidate_plan_ref dup-cand-b)
          test "$dup_plan_a" != "$dup_plan_b" \
            || { echo "::error::identical candidates shared a plan: $dup_plan_a"; exit 1; }
          dup_digest_a=$(get_candidate_digest dup-cand-a)
          dup_digest_b=$(get_candidate_digest dup-cand-b)
          test "$dup_digest_a" = "$dup_digest_b" \
            || { echo "::error::byte-identical candidates disagree on digest: '$dup_digest_a' vs '$dup_digest_b'"; exit 1; }

          # Approve ONLY b's plan; a's plan stays pending.
          approve_plan "$dup_plan_b"

          # Merge the identical content into the parent policy; the approved
          # plan executes it.
          write_promo_policy promo_new_user promo_other_user promo_y_user dup_promo_user
          wait_for_plan_phase "$dup_plan_b" Applied
          assert_role_exists dup_promo_user

          # The candidate whose plan authorized execution is the one promoted.
          wait_for_candidate_phase dup-cand-b Promoted
          wait_for_candidate_condition dup-cand-b Promoted True Promoted

          # dup-cand-a listed first, but its plan never carried the approval:
          # it is superseded, not recorded Promoted.
          wait_for_candidate_phase dup-cand-a Superseded
          a_promoted=$(kubectl get pgcand dup-cand-a \
            -o jsonpath='{.status.conditions[?(@.type=="Promoted")].status}')
          test "$a_promoted" != "True" \
            || { echo "::error::dup-cand-a was recorded Promoted on dup-cand-b's approval"; exit 1; }
          wait_for_plan_phase "$dup_plan_a" Superseded
          dup_reason=$(kubectl get pgplan "$dup_plan_a" \
            -o jsonpath='{.status.conditions[?(@.type=="Superseded")].reason}')
          test "$dup_reason" = "SupersededByPromotion" \
            || { echo "::error::expected SupersededByPromotion on dup-cand-a's plan, got '$dup_reason'"; exit 1; }

          kubectl delete pgcand dup-cand-a dup-cand-b --wait=true

          echo "--- Test: a base change supersedes a pending candidate plan and its stale approval never promotes ---"
          # The parent policy currently holds: promo_new_user promo_other_user
          # promo_y_user dup_promo_user (the duplicate-content promotion).
          # stale-x is filed against that base and NEVER approved; fresh-y is
          # approved and merged, moving the base out from under stale-x.
          file_candidate stale-x promo_new_user promo_other_user promo_y_user dup_promo_user stale_x_user
          wait_for_candidate_phase stale-x Planned
          plan_x1=$(wait_for_candidate_plan_ref stale-x)

          file_candidate fresh-y promo_new_user promo_other_user promo_y_user dup_promo_user fresh_y_user
          wait_for_candidate_phase fresh-y Planned
          plan_y1=$(wait_for_candidate_plan_ref fresh-y)
          approve_plan "$plan_y1"

          # Merge fresh-y's content: the base content digest moves to something
          # that is not stale-x's own content.
          write_promo_policy promo_new_user promo_other_user promo_y_user dup_promo_user fresh_y_user
          wait_for_plan_phase "$plan_y1" Applied
          assert_role_exists fresh_y_user
          wait_for_candidate_phase fresh-y Promoted

          # stale-x's original plan was pinned to the pre-merge base; the base
          # change — not a promotion of its content — must retire it. plan_x1
          # is deliberately unapproved, so promotion-stranding never touches it
          # and the only valid supersede reason is the base change.
          wait_for_plan_phase "$plan_x1" Superseded
          for i in $(seq 1 20); do
            x1_reason=$(kubectl get pgplan "$plan_x1" \
              -o jsonpath='{.status.conditions[?(@.type=="Superseded")].reason}' 2>/dev/null || true)
            if [ "$x1_reason" = "SupersededByBaseChange" ]; then
              echo "$plan_x1 superseded with reason=SupersededByBaseChange"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "::error::expected SupersededByBaseChange on $plan_x1, got '$x1_reason'"
              kubectl get pgplan "$plan_x1" -o yaml || true
              exit 1
            fi
            echo "Waiting for $plan_x1 Superseded reason=SupersededByBaseChange (current='$x1_reason')... ($i/20)"
            sleep 3
          done

          # stale-x gets a FRESH plan pinned to the new base, needing its own
          # approval.
          plan_x2=""
          for i in $(seq 1 20); do
            plan_x2=$(kubectl get pgcand stale-x -o jsonpath='{.status.planRef.name}' 2>/dev/null || true)
            if [ -n "$plan_x2" ] && [ "$plan_x2" != "$plan_x1" ]; then
              echo "stale-x replanned onto $plan_x2"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "::error::stale-x did not receive a fresh plan pinned to the new base (still '$plan_x2')"
              kubectl get pgcand stale-x -o yaml || true
              exit 1
            fi
            echo "Waiting for stale-x to replan away from $plan_x1... ($i/20)"
            sleep 3
          done

          # The replacement is pinned to the base as it now stands: its
          # baseContentDigest must be present and differ from the stale pin.
          base_digest_x1=$(kubectl get pgplan "$plan_x1" -o jsonpath='{.spec.origin.baseContentDigest}')
          base_digest_x2=$(kubectl get pgplan "$plan_x2" -o jsonpath='{.spec.origin.baseContentDigest}')
          test -n "$base_digest_x1" \
            || { echo "::error::superseded plan $plan_x1 has no baseContentDigest"; exit 1; }
          test -n "$base_digest_x2" \
            || { echo "::error::fresh plan $plan_x2 has no baseContentDigest"; exit 1; }
          test "$base_digest_x1" != "$base_digest_x2" \
            || { echo "::error::fresh plan $plan_x2 is pinned to the stale base '$base_digest_x1'"; exit 1; }

          # Nothing of stale-x ever executed.
          assert_role_absent stale_x_user

          kubectl delete pgcand stale-x fresh-y --wait=true
          # Restore the policy content to the set it held before this test.
          write_promo_policy promo_new_user promo_other_user promo_y_user dup_promo_user

          echo "--- Test: the pgroles CLI files and reads a candidate (#189) ---"
          # The CLI is the same workflow through a different door, so it is
          # exercised against the live cluster and every answer it prints is
          # checked against what kubectl reports for the same object.

          candidates_before="$(kubectl get pgcand -o name | wc -l)"

          # Rejected before anything is sent: the CLI validates through the same
          # path as `pgroles validate`, so a candidate the API server would
          # refuse on the identifier bound fails locally first.
          cat >/tmp/cli-cand-invalid.yaml <<'MANIFEST'
          roles:
            - name: this_role_name_is_far_too_long_for_postgresql_which_truncates_at_63_chars
              login: true
          MANIFEST
          if pgroles candidate create --policy promo-policy \
              -f /tmp/cli-cand-invalid.yaml >/tmp/cli-invalid.txt 2>&1; then
            echo "::error::the CLI filed a candidate whose role name exceeds the identifier bound"
            cat /tmp/cli-invalid.txt
            exit 1
          fi
          cat /tmp/cli-invalid.txt
          grep -q 'exceeds the limit of 63' /tmp/cli-invalid.txt \
            || { echo "::error::local validation did not report the field-level bound"; exit 1; }
          # Nothing reached the cluster.
          test "$(kubectl get pgcand -o name | wc -l)" -eq "$candidates_before" \
            || { echo "::error::a rejected candidate was filed anyway"; kubectl get pgcand; exit 1; }

          # A candidate is a complete desired-state snapshot, so the manifest
          # carries the policy's current roles plus the proposed one.
          cat >/tmp/cli-cand.yaml <<'MANIFEST'
          roles:
            - name: promo_base_user
              login: true
            - name: promo_new_user
              login: true
            - name: promo_other_user
              login: true
            - name: promo_y_user
              login: true
            - name: dup_promo_user
              login: true
            - name: cli_candidate_user
              login: true
          MANIFEST
          pgroles candidate create --policy promo-policy -f /tmp/cli-cand.yaml \
            | tee /tmp/cli-create.txt
          # `generateName` means the CLI, not the caller, learns the name.
          cli_cand="$(sed -n 's|^Created postgrespolicycandidate/\([^ ]*\) .*|\1|p' /tmp/cli-create.txt)"
          test -n "$cli_cand" \
            || { echo "::error::the CLI did not print the generated candidate name"; exit 1; }
          kubectl get pgcand "$cli_cand" >/dev/null \
            || { echo "::error::the CLI reported a candidate the cluster does not have"; exit 1; }
          # The server assigned the name from the policy-derived prefix.
          case "$cli_cand" in
            promo-policy-*) ;;
            *) echo "::error::unexpected generateName prefix on '$cli_cand'"; exit 1 ;;
          esac

          wait_for_candidate_phase "$cli_cand" Planned
          cli_plan=$(wait_for_candidate_plan_ref "$cli_cand")

          # list: the CLI's row must agree with kubectl on phase and plan.
          pgroles candidate list --policy promo-policy | tee /tmp/cli-list.txt
          cli_row="$(grep "^${cli_cand}[[:space:]]" /tmp/cli-list.txt)"
          test -n "$cli_row" \
            || { echo "::error::$cli_cand is missing from the CLI's list output"; exit 1; }
          kubectl_phase="$(kubectl get pgcand "$cli_cand" -o jsonpath='{.status.phase}')"
          grep -q "$kubectl_phase" <<<"$cli_row" \
            || { echo "::error::list phase disagrees with kubectl ($kubectl_phase): $cli_row"; exit 1; }
          grep -q "$cli_plan" <<<"$cli_row" \
            || { echo "::error::list plan ref disagrees with kubectl ($cli_plan): $cli_row"; exit 1; }

          # A policy that does not exist must not read as a policy with no
          # candidates: empty output is never ambiguous.
          if pgroles candidate list --policy no-such-policy >/tmp/cli-list-missing.txt 2>&1; then
            echo "::error::listing candidates of a nonexistent policy succeeded"
            cat /tmp/cli-list-missing.txt
            exit 1
          fi
          cat /tmp/cli-list-missing.txt

          # status: the plan and the full content digest must be kubectl's.
          pgroles candidate status "$cli_cand" | tee /tmp/cli-status.txt
          cli_digest="$(get_candidate_digest "$cli_cand")"
          test -n "$cli_digest" || { echo "::error::candidate has no contentDigest"; exit 1; }
          grep -q "$cli_digest" /tmp/cli-status.txt \
            || { echo "::error::status omits the content digest kubectl reports"; exit 1; }
          grep -q "$cli_plan" /tmp/cli-status.txt \
            || { echo "::error::status omits the plan kubectl reports"; exit 1; }
          # Undecided plan, and the CLI says so rather than leaving it blank.
          grep -q 'Decision:      none recorded' /tmp/cli-status.txt \
            || { echo "::error::status did not report the plan as undecided"; exit 1; }

          if pgroles candidate status no-such-candidate >/tmp/cli-status-missing.txt 2>&1; then
            echo "::error::status of a nonexistent candidate succeeded"
            exit 1
          fi
          cat /tmp/cli-status-missing.txt

          # diff: byte-for-byte the SQL the kubectl recipe extracts, whether it
          # came from sqlInline or the gzipped sqlRef ConfigMap.
          cli_sql="$(pgroles candidate diff "$cli_cand" 2>/dev/null)"
          kubectl_sql="$(get_plan_sql "$cli_plan")"
          test -n "$cli_sql" \
            || { echo "::error::the CLI printed no SQL for plan $cli_plan"; exit 1; }
          test "$cli_sql" = "$kubectl_sql" || {
            echo "::error::CLI diff disagrees with the kubectl recipe for $cli_plan"
            diff <(echo "$kubectl_sql") <(echo "$cli_sql") || true
            exit 1
          }
          # It is a proposal, not an execution: nothing of it reached PostgreSQL.
          grep -q 'cli_candidate_user' <<<"$cli_sql" \
            || { echo "::error::the plan SQL does not mention the proposed role"; exit 1; }
          assert_role_absent cli_candidate_user

          # A successor must belong to the same policy as the candidate it
          # replaces; the CLI refuses to file one that does not.
          if pgroles candidate create --policy basic-policy -f /tmp/cli-cand.yaml \
              --replaces "$cli_cand" >/tmp/cli-replaces.txt 2>&1; then
            echo "::error::the CLI filed a successor replacing another policy's candidate"
            cat /tmp/cli-replaces.txt
            exit 1
          fi
          cat /tmp/cli-replaces.txt
          grep -q 'not basic-policy' /tmp/cli-replaces.txt \
            || { echo "::error::the refusal did not name the policy mismatch"; exit 1; }

          kubectl delete pgcand "$cli_cand" --wait=true

          # Cleanup
          kubectl delete pgcand --all --wait=true
          kubectl delete pgr promo-policy --wait=true
          pg_query "DROP ROLE IF EXISTS stale_x_user;"
          pg_query "DROP ROLE IF EXISTS fresh_y_user;"
          for role in promo_base_user promo_new_user promo_other_user promo_y_user dup_promo_user; do
            pg_query "REASSIGN OWNED BY $role TO postgres; DROP OWNED BY $role; DROP ROLE IF EXISTS $role;"
          done

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pgr,pgplan,pgcand,pgeap,pgear -A -o wide || true
          kubectl get pgr,pgplan,pgcand -A -o yaml | head -c 200000 || true
          kubectl -n pgroles-system logs deployment/pgroles-operator --tail=2000 || true
          kubectl -n pgroles-system logs deployment/pgroles-operator --previous --tail=2000 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true

      - name: Cleanup
        if: always()
        run: kind delete cluster --name pgroles-e2e-plans

  # ---------------------------------------------------------------------------
  # Job 7: Ephemeral access — lifecycle plus secure Kyverno admission boundary
  # ---------------------------------------------------------------------------
  e2e-ephemeral-access:
    name: Ephemeral Access E2E (${{ matrix.secure == 'true' && 'Kyverno' || 'trusted-writer' }})
    needs: stack-gate
    if: needs.stack-gate.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - secure: "false"
            cluster: pgroles-e2e-ephemeral-trusted
          - secure: "true"
            cluster: pgroles-e2e-ephemeral-secure
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-e2e
        with:
          cluster-name: ${{ matrix.cluster }}

      - name: Install ephemeral access test identities
        run: |
          kubectl apply -f k8s/security/ephemeral-access-rbac.yaml
          kubectl apply -f k8s/security/ephemeral-access-e2e-rbac.yaml

      - name: Install Kyverno secure admission boundary
        if: matrix.secure == 'true'
        run: |
          curl -fsSL -o /tmp/kyverno-install.yaml \
            https://github.com/kyverno/kyverno/releases/download/v1.18.2/install.yaml
          echo "3dcd43eaf11f0719084217148cd0c82a8fa49faa9b1a783ea5bea2cf84041bda  /tmp/kyverno-install.yaml" \
            | sha256sum -c -
          kubectl create -f /tmp/kyverno-install.yaml
          kubectl wait --for=condition=Established \
            crd/clusterpolicies.kyverno.io \
            crd/validatingpolicies.policies.kyverno.io \
            --timeout=120s
          kubectl -n kyverno wait --for=condition=Available \
            deployment/kyverno-admission-controller \
            deployment/kyverno-background-controller \
            deployment/kyverno-cleanup-controller \
            deployment/kyverno-reports-controller \
            --timeout=240s
          # A Deployment can become Available just before the admission
          # process starts serving its policy webhooks. Applying the policy is
          # the end-to-end readiness probe, so retry only transient webhook
          # startup failures and fail immediately for a malformed policy.
          policy_apply_log="$(mktemp)"
          trap 'rm -f "$policy_apply_log"' EXIT
          policy_applied=false
          for attempt in $(seq 1 30); do
            if kubectl apply -f k8s/security/ephemeral-access-kyverno.yaml \
              >"$policy_apply_log" 2>&1; then
              cat "$policy_apply_log"
              policy_applied=true
              break
            fi
            cat "$policy_apply_log"
            if ! grep -Eq \
              'failed calling webhook|no endpoints available|connection refused|context deadline exceeded' \
              "$policy_apply_log"; then
              exit 1
            fi
            if [ "$attempt" -eq 30 ]; then
              break
            fi
            echo "Kyverno admission webhook is not serving yet (attempt $attempt/30)"
            sleep 2
          done
          if [ "$policy_applied" != true ]; then
            echo "::error::Kyverno admission webhook did not become ready"
            exit 1
          fi
          kubectl wait --for=jsonpath='{.status.conditionStatus.ready}'=true \
            validatingpolicy/pgroles-ephemeral-access-decision-integrity \
            --timeout=120s

      - name: Run ephemeral access lifecycle E2E
        run: scripts/e2e-ephemeral-access.sh "${{ matrix.secure }}"

      # Rides in this job to reuse its Kyverno install: the plan-decision
      # policy is the sibling of the ephemeral one, and this is the only place
      # its approve-verb SAR, decidedBy overwrite, and operator exemption run
      # against a live admission chain.
      - name: Run plan decision admission E2E
        if: matrix.secure == 'true'
        run: scripts/e2e-plan-decision-admission.sh

      - name: Assert the operator survived the ephemeral access scenarios
        run: |
          source scripts/e2e-helpers.sh
          assert_operator_healthy

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pgr,pgeap,pgear,pgplan -A -o wide || true
          kubectl -n pgroles-system logs deployment/pgroles-operator --tail=500 || true
          kubectl -n pgroles-system logs deployment/otel-collector --tail=500 || true
          kubectl -n kyverno logs deployment/kyverno-admission-controller --tail=300 || true

      - name: Cleanup
        if: always()
        run: kind delete cluster --name "${{ matrix.cluster }}"
