name: Setup E2E Environment
description: >
  Creates a kind cluster, deploys PostgreSQL and the pgroles operator,
  and verifies basic reconciliation. Shared across all E2E test suites.
inputs:
  cluster-name:
    description: Name for the kind cluster
    required: true
  operator-features:
    description: Optional operator Cargo features for this test image
    default: ""
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4

    - name: Install kind
      shell: bash
      run: |
        [ -f /usr/local/bin/kind ] || {
          curl -Lo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          echo "b89aada5a39d620da3fcd16435b7f28d858927dd53f92cbac77686b0588b600d  /usr/local/bin/kind" | sha256sum -c -
          chmod +x /usr/local/bin/kind
        }

    - name: Create kind cluster
      shell: bash
      run: |
        # The dev OTLP collector prints every export at detailed verbosity, so
        # at the kubelet's default 10Mi limit its log rotates every few
        # minutes. `kubectl logs` reads only the current file, and the E2E
        # audit check looks for records written minutes earlier.
        cat > "$RUNNER_TEMP/kind-config.yaml" <<'EOF'
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        kubeadmConfigPatches:
          - |
            kind: KubeletConfiguration
            containerLogMaxSize: 200Mi
        EOF
        kind create cluster --name ${{ inputs.cluster-name }} \
          --config "$RUNNER_TEMP/kind-config.yaml" --wait 60s

    # Ship gate for ADR-001 Decision 1. PostgresPolicyCandidate carries a
    # whole-spec `self == oldSelf` CEL rule, and the API server refuses a CRD
    # whose static cost estimate exceeds StaticEstimatedCostLimit (10,000,000).
    # That estimate is derived from the schema's declared bounds and cannot be
    # computed reliably outside a real apiserver, so it is checked against one
    # here. A cost rejection must be recognisable as such and not as a generic
    # apply failure, hence the separate step and the explicit grep.
    - name: "CEL cost gate: PostgresPolicyCandidate CRD is admissible"
      shell: bash
      run: |
        if ! output=$(kubectl apply -f k8s/postgrespolicycandidate-crd.yaml 2>&1); then
          echo "$output"
          if grep -qi 'estimated cost' <<<"$output"; then
            echo "::error::PostgresPolicyCandidate CRD exceeded the CEL static cost limit. \
        The whole-spec immutability rule is not admissible with the current schema bounds; \
        see ADR-001 Decision 1 for the ranked fallbacks."
          else
            echo "::error::PostgresPolicyCandidate CRD was rejected by the API server."
          fi
          exit 1
        fi
        echo "$output"

    - name: Install CRDs
      shell: bash
      run: |
        kubectl apply -f k8s/crd.yaml
        kubectl apply -f k8s/postgrespolicyplan-crd.yaml
        kubectl apply -f k8s/postgrespolicycandidate-crd.yaml
        kubectl apply -f k8s/ephemeralaccesspolicy-crd.yaml
        kubectl apply -f k8s/ephemeralaccessrequest-crd.yaml

    - name: Deploy dev PostgreSQL
      shell: bash
      run: |
        kubectl apply -f k8s/dev/postgres.yaml
        kubectl rollout status statefulset/postgres --timeout=120s

    - name: Wait for PostgreSQL readiness
      shell: bash
      run: kubectl wait --for=condition=ready pod/postgres-0 --timeout=90s

    - name: Seed PostgreSQL
      shell: bash
      run: |
        kubectl exec -i postgres-0 -- psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
        SET password_encryption = 'scram-sha-256';
        CREATE DATABASE loadtest;
        CREATE TABLE IF NOT EXISTS public.inventory_items (
          id integer generated always as identity primary key,
          name text not null
        );
        CREATE SEQUENCE IF NOT EXISTS public.audit_seq;
        DROP ROLE IF EXISTS limited_operator;
        CREATE ROLE limited_operator LOGIN PASSWORD 'limitedpassword';
        ALTER ROLE limited_operator
          NOSUPERUSER
          NOCREATEDB
          NOCREATEROLE
          INHERIT
          NOREPLICATION
          NOBYPASSRLS;
        GRANT CONNECT ON DATABASE postgres TO limited_operator;
        SQL

    - name: Verify limited-privilege role can authenticate
      shell: bash
      run: |
        kubectl exec postgres-0 -- env PGPASSWORD=limitedpassword \
          psql -v ON_ERROR_STOP=1 \
          -h postgres.default.svc.cluster.local \
          -U limited_operator \
          -d postgres \
          -c 'SELECT current_user;' | tee /dev/stderr | grep -q 'limited_operator'

    - name: Create database secrets
      shell: bash
      run: |
        kubectl create secret generic limited-postgres-credentials \
          --from-literal=DATABASE_URL='postgres://limited_operator:limitedpassword@postgres.default.svc.cluster.local:5432/postgres' \
          --dry-run=client -o yaml | kubectl apply -f -

        kubectl create secret generic loadtest-postgres-credentials \
          --from-literal=DATABASE_URL='postgres://postgres:devpassword@postgres.default.svc.cluster.local:5432/loadtest' \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Build operator image
      shell: bash
      env:
        OPERATOR_FEATURES: ${{ inputs.operator-features }}
      run: docker build -f docker/Dockerfile --target operator --build-arg "OPERATOR_FEATURES=$OPERATOR_FEATURES" -t pgroles-operator:e2e .

    - name: Load image into kind
      shell: bash
      run: kind load docker-image pgroles-operator:e2e --name ${{ inputs.cluster-name }}

    - name: Deploy operator
      shell: bash
      run: |
        kubectl apply -f k8s/deploy/namespace.yaml
        kubectl apply -f k8s/deploy/rbac.yaml
        kubectl apply -f k8s/dev/otel-collector.yaml
        kubectl -n pgroles-system rollout status deployment/otel-collector --timeout=120s

        sed 's|ghcr.io/thepartly/pgroles-operator:latest|pgroles-operator:e2e|' \
          k8s/deploy/deployment.yaml | \
          sed 's|imagePullPolicy:.*|imagePullPolicy: Never|' | \
          kubectl apply -f -

        kubectl -n pgroles-system set env deployment/pgroles-operator \
          OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.pgroles-system.svc.cluster.local:4317 \
          OTEL_METRICS_EXPORTER=otlp \
          OTEL_METRIC_EXPORT_INTERVAL=2000

        kubectl -n pgroles-system rollout status deployment/pgroles-operator --timeout=60s

    - name: Verify operator is running
      shell: bash
      run: |
        kubectl apply -f k8s/samples/basic-policy.yaml
        for i in $(seq 1 30); do
          STATUS=$(kubectl get pgr basic-policy -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
          if [ "$STATUS" = "True" ]; then
            echo "Operator verified — basic-policy reconciled"
            exit 0
          fi
          echo "Waiting for reconciliation... (attempt $i/30)"
          sleep 5
        done
        echo "::error::Operator health check failed"
        exit 1

    # Everything a post-mortem needs, in the job log, whenever any setup step
    # fails. A failure with only a 50-line log tail has already cost this repo
    # one round of misdiagnosis; dump complete state instead.
    - name: Setup diagnostics
      if: failure()
      shell: bash
      run: |
        echo "::group::pgroles resources"
        kubectl get pgr,pgplan,pgcand,pgeap,pgear -A -o wide || true
        kubectl get pgr -A -o yaml || true
        echo "::endgroup::"
        echo "::group::operator deployment and pods"
        kubectl -n pgroles-system get pods -o wide || true
        kubectl -n pgroles-system describe deployment/pgroles-operator || true
        kubectl -n pgroles-system describe pods -l app=pgroles-operator || true
        echo "::endgroup::"
        echo "::group::operator logs (current)"
        kubectl -n pgroles-system logs deployment/pgroles-operator --tail=-1 || true
        echo "::endgroup::"
        echo "::group::operator logs (previous container, if restarted)"
        kubectl -n pgroles-system logs deployment/pgroles-operator --previous --tail=-1 || true
        echo "::endgroup::"
        echo "::group::events"
        kubectl get events -A --sort-by=.lastTimestamp || true
        echo "::endgroup::"
