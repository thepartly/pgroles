[advisories]
# Each ignore names why it is safe to carry and what removes it. Revisit them
# whenever the dependency they cover is upgraded.
ignore = [
    # unsafe-libyaml is unmaintained (no known vulnerability). It arrives only
    # through serde_yaml, which pgroles uses to parse manifests and which
    # kube-client 3.x uses for kubeconfig. kube 4.x replaced serde_yaml with
    # serde-saphyr; remove this entry once kube is upgraded and pgroles-core,
    # pgroles-cli and pgroles-operator parse YAML without serde_yaml.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained, reached only via serde_yaml; removed by the kube 4 / serde-saphyr migration" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
